---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: mariadb-ext-secret
    template:
      data:
        # Root password from the 1Password item "mariadb" (single source of
        # truth, no app secrets in sops). Consumers that need root (e.g. the
        # Postal init container) pull the same item via their own ExternalSecret.
        MARIADB_ROOT_PASSWORD: "{{ .mariadb_root_password }}"
  dataFrom:
    - extract:
        key: mariadb
