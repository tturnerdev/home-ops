---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb
  namespace: database
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      mariadb:
        # Single-instance MariaDB for apps that cannot use CNPG (Postal needs
        # MySQL/MariaDB >= 10.6). Postal creates one `postal-server-N` database
        # per mail server, so its role is granted on `postal-%` (see the
        # postal init container).
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: docker.io/library/mariadb
              tag: 11.4.9
              pullPolicy: IfNotPresent
            args:
              - --character-set-server=utf8mb4
              - --collation-server=utf8mb4_unicode_ci
              - --max-allowed-packet=128M
              - --innodb-buffer-pool-size=512M
              # Postal docs: redo log must be >= 10x the largest message
              # (SMTP_SERVER_MAX_MESSAGE_SIZE is 30 MB)
              - --innodb-log-file-size=512M
            env:
              TZ: "America/Los_Angeles"
              MARIADB_AUTO_UPGRADE: "1"
              MARIADB_ROOT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: mariadb-ext-secret
                    key: MARIADB_ROOT_PASSWORD
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    # Image-provided script; the healthcheck@localhost user is
                    # created automatically at first init
                    command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
                  initialDelaySeconds: 20
                  periodSeconds: 15
                  timeoutSeconds: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1Gi
        statefulset:
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 20Gi
              storageClass: ceph-block
              globalMounts:
                - path: /var/lib/mysql
    service:
      app:
        controller: mariadb
        ports:
          mariadb:
            port: 3306
