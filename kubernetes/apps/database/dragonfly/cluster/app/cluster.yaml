---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
  namespace: database
spec:
  replicas: 3
  image: ghcr.io/dragonflydb/dragonfly:v2.0.2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  args:
    # Below the 1Gi limit: at 2Gi the kernel would OOM-kill the pod before
    # Dragonfly evicted anything (it needs at least 256Mi per thread)
    - --maxmemory=768Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    - --default_lua_flags=allow-undeclared-keys
    # v2.0's daily version check also sends anonymous deployment info
    - --version_check=false
  # serviceSpec:
  #   type: ClusterIP