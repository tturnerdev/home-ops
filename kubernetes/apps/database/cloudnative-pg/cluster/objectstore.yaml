---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-backup
  namespace: database
spec:
  retentionPolicy: 30d
  configuration:
    # Bucket + creds from the cnpg-backups ObjectBucketClaim (Ceph RGW)
    destinationPath: s3://cnpg-backups-3e423fc4-c680-4b68-88e6-67382d084def/
    endpointURL: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
    s3Credentials:
      accessKeyId:
        name: cnpg-backups
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backups
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: bzip2
    wal:
      compression: bzip2
      maxParallel: 8
