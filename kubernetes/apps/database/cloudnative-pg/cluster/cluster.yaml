---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/cluster_v1.json

#
# Reference: https://github.com/haraldkoch/kochhaus-home/blob/main/kubernetes/main/apps/dbms/cloudnative-pg/cluster/kochhaus.yaml
#


apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie
  storage:
    storageClass: topolvm-thin-provisioner
    size: 40Gi
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    synchronous:
      method: any
      number: 1
    parameters:
      max_connections: "400"
      shared_buffers: 256MB
      # Cap WAL retained by replication slots so an abandoned/stuck replica can't fill the
      # data volume and crash the DB (root cause of the 2026-05-31 outage). Default -1 = unlimited.
      max_slot_wal_keep_size: 20GB
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
    # Ref: https://github.com/cloudnative-pg/cloudnative-pg/issues/2501
    podMonitorMetricRelabelings:
      - { sourceLabels: ["cluster"], targetLabel: cnpg_cluster, action: replace }
      - { regex: cluster, action: labeldrop }
  # Object-store backups via the Barman Cloud plugin (ObjectStore/postgres-backup).
  # In-tree barmanObjectStore is intentionally NOT used (deprecated, and the
  # operand image ships no barman-cloud binaries).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backup
  # Note: previousCluster needs to be set to the name of the previous
  # cluster when recovering from an existing cnpg cluster
  # bootstrap:
  #   recovery:
  #     source: &previousCluster kochhaus-v1
  #   # upgrade or recover from another running instance
  #   # initdb:
  #   #   import:
  #   #     type: monolith
  #   #     databases:
  #   #       - "*"
  #   #     roles:
  #   #       - "*"
  #   #     source:
  #   #       externalCluster: kochhaus-v16

  # Note: externalClusters is needed when recovering from an existing cnpg cluster
  # externalClusters:
  #   - name: *previousCluster
  #     barmanObjectStore:
  #       <<: *barmanObjectStore
  #       serverName: *previousCluster
  #   # - name: kochhaus-v16
