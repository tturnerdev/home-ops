---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway
spec:
  # Flux does not upgrade this chart's CRDs (Helm skips crds/ on upgrade).
  # Apply them first, then bump the tag here and in bootstrap/helmfile.d/00-crds.yaml:
  #   helm template envoy-gateway oci://mirror.gcr.io/envoyproxy/gateway-helm --version <v> \
  #     -n network --include-crds --no-hooks | yq ea 'select(.kind == "CustomResourceDefinition")' \
  #     | kubectl apply --server-side --force-conflicts -f -
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.9.2
  url: oci://mirror.gcr.io/envoyproxy/gateway-helm