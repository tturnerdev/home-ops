---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8s-gateway
  namespace: network # Required for Renovate lookups
spec:
  interval: 168h
  url: https://k8s-gateway.github.io/k8s_gateway
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 168h
  chart:
    spec:
      chart: k8s-gateway
      version: 3.7.1
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: network
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN}"
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      annotations:
        lbipam.cilium.io/ips: "10.13.38.53"
      externalTrafficPolicy: Cluster
    watchedResources: ["Ingress", "Service"]
    # Tailscale split DNS sends all *.${SECRET_DOMAIN} queries from VPN clients
    # here; names the cluster doesn't own must keep resolving.
    fallthrough:
      enabled: true
    # Setting extraZonePlugins replaces the chart defaults wholesale, so this
    # reproduces them with one change: fallthrough queries go to the UniFi
    # gateway resolver (which holds the LAN-only records) instead of the pod's
    # resolv.conf.
    extraZonePlugins:
      - name: log
      - name: errors
      # Serves a /health endpoint on :8080, required for livenessProbe
      - name: health
        configBlock: |-
          lameduck 5s
      # Serves a /ready endpoint on :8181, required for readinessProbe
      - name: ready
      # Serves a /metrics endpoint on :9153, required for serviceMonitor
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: forward
        parameters: . 10.13.37.1
      - name: loop
      - name: reload
      - name: loadbalance
