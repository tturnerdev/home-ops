---
originRequest:
  originServerName: "external.${SECRET_DOMAIN}"

ingress:
  - hostname: "${SECRET_DOMAIN}"
    service: &svc https://external-ingress-nginx-controller.network.svc.cluster.local:443
  - hostname: "*.${SECRET_DOMAIN}"
    service: *svc
  - hostname: "sign.${SECRET_DOMAIN_2}"
    service: *svc
  - hostname: "automate.${SECRET_DOMAIN_2}"
    service: *svc
  # Postal (open-tracking relay) + Inbox Zero. t.<domain> is a DNS-only CNAME
  # to track.postal.<domain>; the Host header survives the chain.
  - hostname: "postal.${SECRET_DOMAIN_2}"
    service: *svc
  - hostname: "track.postal.${SECRET_DOMAIN_2}"
    service: *svc
  - hostname: "t.${SECRET_DOMAIN_2}"
    service: *svc
  - hostname: "inbox.${SECRET_DOMAIN_2}"
    service: *svc
  # Inbox Zero's final home — harmless until the CNAME is repointed at cutover
  - hostname: "mail.${SECRET_DOMAIN_2}"
    service: *svc
  - service: http_status:404
