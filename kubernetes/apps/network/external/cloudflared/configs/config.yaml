---
originRequest:
  # SNI and certificate check for the origin connection. envoy-external
  # answers this SNI with the primary-domain wildcard whatever Host header
  # follows (it serves the secondary-domain wildcard only for that SNI), so
  # one name covers every hostname below.
  originServerName: "external.${SECRET_DOMAIN}"

ingress:
  - hostname: "${SECRET_DOMAIN}"
    # envoy-external's https listener (HTTPRoutes with parentRef sectionName
    # https). Its http listener only carries the 301 redirect, so the origin
    # must be https.
    service: &svc https://envoy-external.network.svc.cluster.local:443
  - hostname: "*.${SECRET_DOMAIN}"
    service: *svc
  - hostname: "sign.${SECRET_DOMAIN_2}"
    service: *svc
  - hostname: "automate.${SECRET_DOMAIN_2}"
    service: *svc
  # Hudu lives at docs.<domain>; hudu.<domain> was its staging name and still
  # routes
  - hostname: "hudu.${SECRET_DOMAIN_2}"
    service: *svc
  - hostname: "docs.${SECRET_DOMAIN_2}"
    service: *svc
  # RustDesk API/admin (lejianwen/rustdesk-api) only; the ID/relay server
  # itself is raw TCP/UDP on its own VIP and cannot ride the tunnel.
  - hostname: "rdesk-api.${SECRET_DOMAIN_2}"
    service: *svc
  - service: http_status:404
