---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-ddns
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Keeps the A record for the public SMTP endpoint (Postal) pointed at the
    # current WAN IP. That host must NOT go through the Cloudflare tunnel
    # (raw SMTP), so external-dns/cloudflared cannot publish it. The record is
    # created/adopted by the tool; external-dns never touches it (domain
    # filter + no ownership TXT), so nothing fights over it.
    controllers:
      cloudflare-ddns:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/favonia/cloudflare-ddns
              tag: 1.17.0
              pullPolicy: IfNotPresent
            env:
              # Same zone-scoped token external-dns uses (secret in this
              # namespace); it must include the secondary zone (Zone:Read +
              # DNS:Edit) for this to work
              CLOUDFLARE_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: external-dns-secret
                    key: api-token
              DOMAINS: "smtp.postal.${SECRET_DOMAIN_2}"
              PROXIED: "false"
              IP6_PROVIDER: none
              # HTTPS to 1.1.1.1/cdn-cgi/trace: sees the WAN IP through the
              # node NAT, so no hostNetwork is needed
              IP4_PROVIDER: cloudflare.trace
              UPDATE_CRON: "@every 5m"
              # Cloudflare "auto"
              TTL: "1"
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
