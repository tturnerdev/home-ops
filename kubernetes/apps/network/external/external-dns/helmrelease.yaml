---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns
spec:
  interval: 168h
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-secret
            key: api-token
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --events
      - --ignore-ingress-tls-spec
      - --ingress-class=external
      # HTTPRoutes: only those attached to envoy-external. That Gateway carries
      # the external.<d> target annotation, so its routes become proxied
      # CNAMEs to the tunnel like the external Ingresses; envoy-internal's
      # routes (A records to a LAN address) are never considered.
      - --gateway-name=envoy-external
      - --gateway-namespace=network
      # v0.22 made external-dns.kubernetes.io/ the only annotation prefix; every
      # ingress here still uses external-dns.alpha.kubernetes.io/target, and with
      # policy sync, ignoring it would repoint records. Read the legacy prefix
      # until the annotations are migrated (the flag is a temporary aid).
      - --enable-legacy-annotation-prefix
    policy: sync
    sources: ["crd", "ingress", "gateway-httproute"]
    txtPrefix: k8s.
    txtOwnerId: default
    domainFilters: ["${SECRET_DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: external-dns-secret
