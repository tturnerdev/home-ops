---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      homepage:
        annotations:
          # The config files are subPath mounts, which never see ConfigMap
          # updates; restart the pod instead
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.6.0
            env:
              TZ: "America/Los_Angeles"
              HOMEPAGE_ALLOWED_HOSTS: "homepage.${SECRET_DOMAIN}"
            resources:
              requests:
                memory: 100Mi
                cpu: 100m
              # limits:
              #   memory: 500Mi
              #   cpu: 500m
            # securityContext:
            #   runAsUser: 568
            #   runAsGroup: 568
            #   runAsNonRoot: true
            #   readOnlyRootFilesystem: true
            #   allowPrivilegeEscalation: false
            #   capabilities:
            #     drop:
            #       - ALL

    defaultPodOptions:
      # app-template 5.x stops mounting the ServiceAccount token by default;
      # the kubernetes widget and ingress/route discovery need it
      automountServiceAccountToken: true

    service:
      app:
        controller: homepage
        ports:
          http:
            port: 3000

    ingress:
      app:
        enabled: true
        className: internal
        annotations:
          external-dns.alpha.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
        hosts:
          - host: "homepage.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http

    # Services are discovered from the apps' own Ingresses/HTTPRoutes: an app
    # shows up once it carries gethomepage.dev/* annotations (enabled, group,
    # name, icon). This read-only role is what discovery and the kubernetes
    # widget need, per the Homepage k8s install docs (Traefik rule dropped).
    serviceAccount:
      homepage: {}

    rbac:
      roles:
        homepage:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: [namespaces, pods, nodes]
              verbs: [get, list]
            - apiGroups: [extensions, networking.k8s.io]
              resources: [ingresses]
              verbs: [get, list]
            - apiGroups: [gateway.networking.k8s.io]
              resources: [httproutes, gateways]
              verbs: [get, list]
            - apiGroups: [metrics.k8s.io]
              resources: [nodes, pods]
              verbs: [get, list]
      bindings:
        homepage:
          type: ClusterRoleBinding
          roleRef:
            identifier: homepage
          subjects:
            - identifier: homepage

    persistence:
      # Logs and the files Homepage generates for itself (docker.yaml,
      # proxmox.yaml, custom.css/js) live here
      config:
        enabled: true
        existingClaim: homepage
        globalMounts:
          - path: /app/config
      # The dashboard config, mounted straight from git. Until 2026-10-22 an
      # init container copied these onto the PVC only when missing, so edits
      # here never reached the dashboard.
      config-files:
        enabled: true
        type: configMap
        identifier: config
        globalMounts:
          - path: /app/config/bookmarks.yaml
            subPath: bookmarks.yaml
            readOnly: true
          - path: /app/config/services.yaml
            subPath: services.yaml
            readOnly: true
          - path: /app/config/settings.yaml
            subPath: settings.yaml
            readOnly: true
          - path: /app/config/widgets.yaml
            subPath: widgets.yaml
            readOnly: true
          - path: /app/config/kubernetes.yaml
            subPath: kubernetes.yaml
            readOnly: true

    configMaps:
      config:
        enabled: true
        data:
          bookmarks.yaml: |
            ---
            []

          # Hand-written entries go here; discovered apps need none
          services.yaml: |
            ---
            []

          settings.yaml: |
            ---
            title: Home Ops
            headerStyle: clean
            # Group order on the page; groups come from gethomepage.dev/group
            layout:
              Media:
                style: row
                columns: 4
              Home:
                style: row
                columns: 4
              Atrelix:
                style: row
                columns: 4
              Admin:
                style: row
                columns: 4

          widgets.yaml: |
            ---
            - kubernetes:
                cluster:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
                  label: home-ops
                nodes:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true

            - search:
                provider: duckduckgo
                target: _blank

          kubernetes.yaml: |
            ---
            mode: cluster
            ingress: true
            gateway: true
