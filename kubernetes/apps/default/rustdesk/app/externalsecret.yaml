---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# STAGED, NOT ACTIVE. rustdesk-secret is currently rendered from ./secret.sops.yaml
# (1Password item creation isn't possible through the Connect server the
# cluster uses, so the first deploy shipped SOPS). To move to 1Password:
#   1. Create item "rustdesk" in vault "Home-Ops Default" with fields
#      rustdesk_key (base64 64-byte secret key) and rustdesk_key_pub (values:
#      `sops -d secret.sops.yaml`). Rotating instead means every client must
#      be given the new public key — see the README.
#   2. Uncomment this file in kustomization.yaml, delete secret.sops.yaml, and
#      add `external-secrets` (namespace external-secrets) to ks.yaml dependsOn.
#   Flux prunes the SOPS Secret and ES creates the same-named one; reloader
#   restarts the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustdesk
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: rustdesk-secret
    template:
      data:
        # Signing key for hbbs and hbbr (env KEY in both containers)
        KEY: "{{ .rustdesk_key }}"
        # Public half, reference only — what clients enter as "Key"
        KEY_PUB: "{{ .rustdesk_key_pub }}"
  dataFrom:
    - extract:
        key: rustdesk
