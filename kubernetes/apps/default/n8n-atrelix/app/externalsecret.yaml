---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-atrelix
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: n8n-atrelix-ext-secret
    template:
      data:
        # CNPG superuser creds consumed by the postgres-init initContainer,
        # which creates the app role/database on first start
        INIT_POSTGRES_SUPER_USER: postgres
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # App-level values from the 1Password item "n8n-atrelix" — the single
        # source of truth (no app secrets in sops). Update there; ES syncs down.
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: n8n_atrelix
        INIT_POSTGRES_USER: "{{ .n8n_postgres_user }}"
        INIT_POSTGRES_PASS: "{{ .n8n_postgres_password }}"
        POSTGRES_USER: "{{ .n8n_postgres_user }}"
        POSTGRES_PASSWORD: "{{ .n8n_postgres_password }}"
        # Critical: never rotate — n8n refuses to start on an encryption key
        # mismatch with its data volume, and stored credentials become unreadable
        N8N_ENCRYPTION_KEY: "{{ .n8n_encryption_key }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: n8n-atrelix
