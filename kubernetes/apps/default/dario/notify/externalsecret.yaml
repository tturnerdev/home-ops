---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dario-notify
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: dario-notify-secret
    template:
      engineVersion: v2
      data:
        # SMTP: reuses the n8n relay credentials, as documenso does
        SMTP_HOST: "{{ .n8n_smtp_host }}"
        SMTP_PORT: "{{ .n8n_smtp_port }}"
        SMTP_USER: "{{ .n8n_smtp_user }}"
        SMTP_PASS: "{{ .n8n_smtp_pass }}"
        SMTP_FROM: "{{ .n8n_smtp_sender }}"
  dataFrom:
    - extract:
        key: n8n
