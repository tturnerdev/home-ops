---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# STAGED, NOT ACTIVE. dario-secret is currently rendered from ./secret.sops.yaml
# (1Password item creation isn't possible through the Connect server the
# cluster uses, so the first deploy shipped SOPS). To move to 1Password:
#   1. Create item "dario" in vault "Home-Ops Default" with fields
#      dario_api_key and dario_admin_token (values: `sops -d secret.sops.yaml`,
#      or rotate — clients then need the new key).
#   2. Uncomment this file in kustomization.yaml, delete secret.sops.yaml, and
#      add `external-secrets` (namespace external-secrets) to ks.yaml dependsOn.
#   Flux prunes the SOPS Secret and ES creates the same-named one; reloader
#   restarts the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dario
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: dario-secret
    template:
      data:
        # Proxy key clients send as ANTHROPIC_API_KEY / OPENAI_API_KEY
        DARIO_API_KEY: "{{ .dario_api_key }}"
        # Bearer for the headless /admin/* account-provisioning API
        DARIO_ADMIN_TOKEN: "{{ .dario_admin_token }}"
  dataFrom:
    - extract:
        key: dario
