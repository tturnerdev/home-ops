---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# CNPG superuser credentials for the postgres-init initContainer, which
# creates the famlin role and database on first start (the role's own password
# is DB_PASSWORD in secret.sops.yaml). Kept apart from famlin-secret so the
# internet-facing app container never holds them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: famlin-init
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: famlin-init-secret
    template:
      data:
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: famlin
        INIT_POSTGRES_USER: famlin
        INIT_POSTGRES_SUPER_USER: postgres
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
