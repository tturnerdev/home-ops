---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: famlin
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  # Longer than the startup probe's 10 minutes, so Helm never gives up on a
  # release while its pod is still migrating the database
  timeout: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # No automatic rollback. Every release migrates the database one way at
    # start and an older image refuses to run against a newer schema, so a
    # rollback could only interrupt a migration or crash-loop. A failed
    # upgrade stays failed (and alerts) until it is fixed by hand.
    remediation:
      retries: 0
  uninstall:
    keepHistory: false
  values:
    controllers:
      famlin:
        # RWO volumes: the old pod has to let go before the new one mounts them
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17.6
              pullPolicy: IfNotPresent
            env:
              INIT_POSTGRES_PASS:
                valueFrom:
                  secretKeyRef:
                    name: famlin-secret
                    key: DB_PASSWORD
            envFrom:
              # The other INIT_POSTGRES_* values, including the CNPG
              # superuser (externalsecret.yaml)
              - secretRef:
                  name: famlin-init-secret
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          app:
            # Pre-1.0 with one-way migrations: Renovate opens PRs for it but
            # never merges them. Back up before bumping (see ../README.md).
            image:
              repository: ghcr.io/timvanonckelen/famlin
              tag: 0.10.0@sha256:6eb02a0d39545a8617d1513d1903636c949142c145364c24d148b1063281c571
              pullPolicy: IfNotPresent
            env:
              # Scheduled backups run at a local hour
              TZ: "America/Los_Angeles"
              NODE_ENV: production
              PORT: "3000"
              # Behind Envoy Gateway: invite links and QR codes are built from
              # X-Forwarded-Proto and the Host header
              TRUST_PROXY: "true"
              STORAGE_DRIVER: local
              # boot.js runs `npx prisma migrate deploy` before the server.
              # The root filesystem is read-only, so npm keeps its cache and
              # logs on /tmp and skips its registry update check; Prisma's
              # update check and telemetry stay off too.
              NPM_CONFIG_CACHE: /tmp/.npm
              NPM_CONFIG_UPDATE_NOTIFIER: "false"
              CHECKPOINT_DISABLE: "1"
              # Everything else (SMTP, public URL, branding, backups, upload
              # limits) lives in the database and is set in /admin
            envFrom:
              # DATABASE_URL, JWT_SECRET (sops); DB_PASSWORD is for init-db
              - secretRef:
                  name: famlin-secret
            probes:
              # boot.js migrates the database before the server listens:
              # allow 10 minutes for that
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              # /health checks the database and that the uploads volume is
              # writable (200, or 503)
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Five minutes of failures before a restart, so a database
              # failover or a short outage only takes the pod out of the
              # Service
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 10
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              # sharp/libvips (HEIC) and ffmpeg spike on large uploads
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        # The image's `node` user; given as numbers because the image names
        # its user, which runAsNonRoot cannot verify
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: famlin
        ports:
          http:
            port: 3000
    route:
      # Public: cloudflared's wildcard rule for the primary domain already
      # sends this name to envoy-external, and on the LAN it resolves
      # straight to the gateway, so one hostname serves both. Added only
      # after the first-run admin setup (../README.md).
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Home"
          gethomepage.dev/name: "Famlin"
          gethomepage.dev/icon: "mdi-human-male-female-child"
          gethomepage.dev/description: "Family photos and updates"
        hostnames:
          - "fam.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 3000
            # Envoy's default route timeout (15s for the whole response) is
            # already lifted for every route by the gateway-wide
            # BackendTrafficPolicy (requestTimeout: 0s, in
            # network/envoy-gateway). A route's own timeout takes precedence
            # over that policy, so any finite value here would add a cap; 0s
            # keeps multi-GB video downloads and long upload processing
            # unlimited even if the gateway default changes.
            timeouts:
              request: 0s
    persistence:
      # Only the app container mounts the family's data; init-db needs none
      # of it
      uploads:
        existingClaim: famlin-uploads
        advancedMounts:
          famlin:
            app:
              - path: /app/uploads
      data:
        existingClaim: famlin-data
        advancedMounts:
          famlin:
            app:
              - path: /app/data
      # Famlin's own scheduled backups (zip, pg_dump, uploads mirror) on the
      # NAS, written as uid 1000; NFS ignores fsGroup, so the share's
      # ownership must allow that
      backups:
        type: nfs
        server: "${SECRET_NFS_IP}"
        path: /mnt/storage/backups/famlin
        advancedMounts:
          famlin:
            app:
              - path: /app/backups
      # A whole upload request (a selection of photos and videos) is spooled
      # here and processed (HEIC conversion, video poster frames). Exceeding
      # the limit evicts the pod: raise it if "Largest upload" x attachments
      # in /admin grows past it.
      tmp:
        type: emptyDir
        sizeLimit: 5Gi
        globalMounts:
          - path: /tmp
      # Thumbnail cache of the optional "local folder" media source; the
      # rest of the root filesystem is read-only
      media-cache:
        type: emptyDir
        sizeLimit: 1Gi
        advancedMounts:
          famlin:
            app:
              - path: /app/media-cache
