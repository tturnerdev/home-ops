---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# App values from the 1Password item "shlink".
# INITIAL_API_KEY only creates a key while the database has none; the web
# client (../../shlink-web-client) reads the same value from this secret.
# The GeoLite licence key is not taken from the item yet: its
# shlink_geolite_license_key field holds a value MaxMind rejects, so the
# working key ships in secret.sops.yaml until that field is corrected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shlink
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: shlink-secret
    template:
      data:
        DB_PASSWORD: "{{ .shlink_db_password }}"
        INITIAL_API_KEY: "{{ .shlink_api_key }}"
  dataFrom:
    - extract:
        key: shlink
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# CNPG superuser credentials for the postgres-init initContainer, which
# creates the role and database on first start. Kept apart from shlink-secret
# so the internet-facing app container never holds them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shlink-init
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: shlink-init-secret
    template:
      data:
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: shlink
        INIT_POSTGRES_USER: shlink
        INIT_POSTGRES_PASS: "{{ .shlink_db_password }}"
        INIT_POSTGRES_SUPER_USER: postgres
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: shlink
