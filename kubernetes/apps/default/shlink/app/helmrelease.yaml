---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shlink
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      shlink:
        # All state is in PostgreSQL, so the new pod can come up before the old
        # one stops: short links keep redirecting through image updates
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 0
          surge: 1
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17.6
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: shlink-init-secret
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          app:
            image:
              repository: shlinkio/shlink
              tag: 5.1.9
              pullPolicy: IfNotPresent
            env:
              TIMEZONE: "America/Los_Angeles"
              # Short links are served on the third domain (an apex name)
              DEFAULT_DOMAIN: "${SECRET_DOMAIN_3}"
              IS_HTTPS_ENABLED: "true"
              # The bare domain, without a short code, forwards to the company
              # site instead of showing Shlink's 404 page. Unknown short codes
              # still get the 404.
              DEFAULT_BASE_URL_REDIRECT: "https://${SECRET_DOMAIN_2}"
              DB_DRIVER: postgres
              DB_HOST: postgres-rw.database.svc.cluster.local
              DB_PORT: "5432"
              DB_NAME: shlink
              DB_USER: shlink
              # RoadRunner starts one worker of each kind per CPU core when these
              # are unset, far more than a handful of redirects needs
              WEB_WORKER_NUM: "2"
              TASK_WORKER_NUM: "1"
            envFrom:
              # DB_PASSWORD, INITIAL_API_KEY (1Password)
              - secretRef:
                  name: shlink-secret
              # GEOLITE_LICENSE_KEY (sops)
              - secretRef:
                  name: shlink-geolite-secret
            probes:
              # Shlink migrates the database and downloads the GeoLite file
              # before it opens the port
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 60
              # /rest/health also checks the database, so it only gates traffic;
              # a database outage must not restart the pod
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
            securityContext: *securityContext
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        # uid of the image's own user; also given explicitly because the
        # postgres-init image names its user (nobody), which runAsNonRoot
        # cannot verify
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: shlink
        ports:
          http:
            port: 8080
    route:
      # Public: the short links themselves.
      # Public DNS: a manual proxied record in that zone ->
      # <tunnel-id>.cfargotunnel.com (external-dns only manages the primary
      # domain), plus the matching hostname rule in the cloudflared config.
      app:
        hostnames:
          - "${SECRET_DOMAIN_3}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
      # Internal: the REST API under the web client's hostname (see
      # ../../shlink-web-client), so the admin UI talks to it same-origin and
      # never depends on public DNS
      api:
        hostnames:
          - "shlink.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /rest
            backendRefs:
              - identifier: app
                port: 8080
    persistence:
      # Only caches, locks and the GeoLite file, all rebuilt at start; the
      # entrypoint creates the sub-directories itself
      data:
        type: emptyDir
        globalMounts:
          - path: /etc/shlink/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
