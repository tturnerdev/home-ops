---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hudu
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: hudu-ext-secret
    template:
      data:
        # CNPG superuser creds, consumed only by the hudu-db-init Job: it
        # creates the app role/database and the superuser-only pgvector
        # extension. Everything the app itself reads lives in hudu-app-secret
        # (sops) — see secret.sops.yaml.
        INIT_POSTGRES_SUPER_USER: postgres
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
