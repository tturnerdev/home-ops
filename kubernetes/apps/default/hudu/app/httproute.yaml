---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Hudu's chart (0.3.x) renders Ingresses only, so the route is hand-written.
# Public DNS: manual proxied CNAME in the zone -> <tunnel-id>.cfargotunnel.com
# plus the cloudflared ingress rule (cloudflare external-dns excludes this
# zone). LAN DNS: unifi-dns publishes this host as a CNAME to external.<domain>
# (the Gateway's target annotation), the alias that points at envoy-external.
# TLS: the secondary-domain wildcard on envoy-external's https listener.
# Uploads: Hudu hands browsers presigned MinIO URLs, so the 200 MB files never
# cross this route; Envoy applies no request-body limit anyway (nginx needed
# proxy-body-size 256m). ActionCable is a WebSocket: upgrades are on by default.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hudu
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Atrelix"
    gethomepage.dev/name: "Hudu"
    gethomepage.dev/icon: "mdi-book-open-page-variant"
    gethomepage.dev/description: "IT documentation"
    # The chart labels pods app.kubernetes.io/name=hudu-helm-chart, so
    # Homepage's default name-based status lookup finds nothing
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=hudu,app.kubernetes.io/component=web"
spec:
  hostnames: ["docs.${SECRET_DOMAIN_2}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: hudu-web
          port: 3000
