---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workflow-console
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: workflow-console-ext-secret
    template:
      data:
        # n8n public-API key from the 1Password item "n8n-atrelix" — the
        # console's only secret (board queue + execution state + graph).
        # Rotate in n8n, update the 1P field, ES syncs down.
        N8N_API_KEY: "{{ .n8n_api_key }}"
  dataFrom:
    - extract:
        key: n8n-atrelix
