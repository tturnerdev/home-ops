---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workflow-console
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: workflow-console-1p-secret
    template:
      data:
        # n8n owner login for the run queue (the n8n 2.7.2 public API omits
        # waiting executions, so the console reads the editor API). Rotate the
        # n8n password by updating the 1Password item — it syncs down from here.
        N8N_LOGIN_PASSWORD: "{{ .admin_user_password }}"
  dataFrom:
    - extract:
        key: n8n-atrelix
