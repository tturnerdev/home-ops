---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      paperless-ngx:
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17.6
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: paperless-ngx-secret
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.4.1@sha256:1a08d8dfc2b51a08de09652dd86ad4d0c611c362382f944533ad38b73125fbc4
              pullPolicy: IfNotPresent
            env:
              TZ: "America/Los_Angeles"
              PAPERLESS_TIME_ZONE: "America/Los_Angeles"
              PAPERLESS_PORT: "8000"
              PAPERLESS_URL: "https://docs.${SECRET_DOMAIN}"
              PAPERLESS_CSRF_TRUSTED_ORIGINS: "https://docs.${SECRET_DOMAIN}"
              PAPERLESS_CORS_ALLOWED_HOSTS: "https://docs.${SECRET_DOMAIN}"
              PAPERLESS_OCR_LANGUAGE: "eng"
              PAPERLESS_OCR_LANGUAGES: "eng"
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_CONSUMPTION_DIR: "/consume"
              PAPERLESS_DATA_DIR: "/data"
              PAPERLESS_MEDIA_ROOT: "/media"
              # Envoy sets no X-Real-IP; it appends the TCP peer (the LAN client -
              # Cilium keeps source addresses) as the LAST X-Forwarded-For entry.
              # One trusted hop makes allauth (v3) rate-limit logins per client and
              # ignore anything a client puts in the header itself.
              PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT: "1"
              # Database. v3 no longer infers PostgreSQL from DBHOST: without
              # DBENGINE it silently starts on an empty SQLite file
              PAPERLESS_DBENGINE: "postgresql"
              PAPERLESS_DBHOST: "postgres-rw.database.svc.cluster.local"
              PAPERLESS_DBPORT: "5432"
              PAPERLESS_DBNAME: "paperless-ngx"
              PAPERLESS_DBUSER:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-secret
                    key: POSTGRES_USER
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-secret
                    key: POSTGRES_PASSWORD
              # Redis
              PAPERLESS_REDIS:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-secret
                    key: REDIS_URL
              # Secrets
              PAPERLESS_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-secret
                    key: PAPERLESS_SECRET_KEY
              PAPERLESS_ADMIN_USER: "admin"
              PAPERLESS_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: paperless-ngx-secret
                    key: PAPERLESS_ADMIN_PASSWORD
            resources:
              requests:
                cpu: 1000m
                memory: 256Mi
              limits:
                memory: 2Gi
    #         securityContext:
    #           allowPrivilegeEscalation: false
    #           readOnlyRootFilesystem: false
    #           capabilities:
    #             drop:
    #               - ALL
    # defaultPodOptions:
    #   securityContext:
    #     runAsNonRoot: true
    #     runAsUser: 568
    #     runAsGroup: 568
    #     fsGroup: 568
    #     fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: paperless-ngx
        ports:
          http:
            port: 8000
    route:
      app:
        # Large uploads: Envoy applies no request-body limit (nginx had proxy-body-size 0).
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Home"
          gethomepage.dev/name: "Paperless"
          gethomepage.dev/icon: "paperless-ngx.svg"
          gethomepage.dev/description: "Documents"
        hostnames:
          - "docs.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8000
    persistence:
      data:
        enabled: true
        existingClaim: paperless-ngx-data
        globalMounts:
          - path: /data
      media:
        enabled: true
        existingClaim: paperless-ngx-media
        globalMounts:
          - path: /media
      consume:
        enabled: true
        existingClaim: paperless-ngx-consume
        globalMounts:
          - path: /consume
      config:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /config