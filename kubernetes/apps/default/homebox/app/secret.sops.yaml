# HBOX_AUTH_API_KEY_PEPPER is mandatory since Homebox 0.26 (May 2026): it is the
# HMAC key for stored API-key hashes and the binary refuses to start without
# >= 32 bytes. It must stay stable - rotating it invalidates every issued API key.
# SOPS rather than 1Password because the Connect token cannot add fields; to
# migrate, add this value to the 1Password "homebox" item, template it in
# externalsecret.yaml, and drop this file from kustomization.yaml.
