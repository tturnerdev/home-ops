---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homebox
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      homebox:
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17.6
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: homebox
              - secretRef:
                  name: homebox-initdb
        containers:
          homebox:
            # nightly (upstream main) pinned by digest: the label template system
            # (sysadminsmedia/homebox#1161, merged 2026-10-31) is not in a tagged
            # release yet. Renovate's list-B rule rolls the digest; go back to a
            # release tag once one ships it.
            image:
              repository: ghcr.io/sysadminsmedia/homebox
              tag: nightly-rootless@sha256:aa24ef2500cedf24b77bf2dc430ad96cd049e9a9d14992220d35a0e629e61a8b
              # pullPolicy: IfNotPresent
            env:
              TZ: America/Los_Angeles
              HBOX_LOG_LEVEL: info
              HBOX_LOG_FORMAT: json
              HBOX_WEB_PORT: &port "7745"
              HBOX_WEB_MAX_UPLOAD_SIZE: 100
              HBOX_DATABASE_DRIVER: postgres
              HBOX_DATABASE_SSL_MODE: disable
              # HBOX_OPTIONS_ALLOW_REGISTRATION: "false"
              HBOX_OPTIONS_CHECK_GITHUB_RELEASE: "false"
            envFrom:
              - secretRef:
                  name: homebox
              - secretRef:
                  name: homebox-secret
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: homebox
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "box.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 7745
    persistence:
      data:
        existingClaim: ${APP}
      modcache:
        type: emptyDir
        sizeLimit: 100Mi
        globalMounts:
          - path: /.cache