---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: documenso
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      documenso:
        # Default Recreate causes ~5min outages (app ignores SIGTERM); Documenso
        # supports concurrent replicas, so overlap during rollout is safe
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17.6
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: documenso-app-secret
              - secretRef:
                  name: documenso-ext-secret
        containers:
          app:
            # Atrelix fork image (en-US locale + email de-branding baked in),
            # built from atrelixtech/atrelix-sign; digest-pinned for reproducibility
            image:
              repository: ghcr.io/atrelixtech/atrelix-sign
              tag: v2.17.0-atrelix@sha256:879c7d647caff3b1f4f1d8e1ffcb4f6197f710a84624c27e07d0f8a82c8816a2
              pullPolicy: IfNotPresent
            env:
              TZ: "America/Los_Angeles"
              DOCUMENSO_DISABLE_TELEMETRY: "true"
              NEXT_PUBLIC_WEBAPP_URL: "https://sign.${SECRET_DOMAIN_2}"
              # Background jobs call back into the app; stay in-pod
              NEXT_PRIVATE_INTERNAL_WEBAPP_URL: "http://localhost:3000"
              NEXT_PUBLIC_UPLOAD_TRANSPORT: "database"
              NEXT_PUBLIC_DOCUMENT_SIZE_UPLOAD_LIMIT: "20"
              NEXT_PRIVATE_JOBS_PROVIDER: "local"
              NEXT_PRIVATE_SIGNING_TRANSPORT: "local"
              NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: "/opt/documenso/cert.p12"
              NEXT_PRIVATE_ALLOWED_SIGNUP_DOMAINS: "${SECRET_DOMAIN_2}"
              # "true" closes registration; flip to "false" (domain allowlist above
              # still restricts signups) when onboarding new users
              NEXT_PUBLIC_DISABLE_SIGNUP: "true"
            envFrom:
              - secretRef:
                  name: documenso-app-secret
              - secretRef:
                  name: documenso-ext-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  periodSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-pull
    service:
      app:
        controller: documenso
        ports:
          http:
            port: 3000
    route:
      app:
        # Public DNS: manual proxied CNAME in the zone -> <tunnel-id>.cfargotunnel.com
        # (the cloudflare external-dns domain filter excludes this zone).
        # LAN DNS: unifi-dns publishes this host as a CNAME to external.<domain> (the
        # Gateway's target annotation), the alias that points at envoy-external.
        # TLS: the secondary-domain wildcard on envoy-external's https listener
        # (cert-manager/tls, DNS-01); no per-host certificate any more.
        # Uploads: no body-size cap on Envoy (nginx needed 50m).
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Atrelix"
          gethomepage.dev/name: "Documenso"
          gethomepage.dev/icon: "documenso.svg"
          gethomepage.dev/description: "Document signing"
        hostnames:
          - "sign.${SECRET_DOMAIN_2}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 3000
    persistence:
      signing-cert:
        type: secret
        name: documenso-signing-cert
        globalMounts:
          - path: /opt/documenso/cert.p12
            subPath: cert.p12
            readOnly: true
