---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: documenso
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: documenso-ext-secret
    template:
      data:
        # SMTP — reuses the n8n relay credentials; swap to a dedicated
        # 1Password item if Documenso should send from its own identity
        NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
        NEXT_PRIVATE_SMTP_HOST: "{{ .n8n_smtp_host }}"
        NEXT_PRIVATE_SMTP_PORT: "{{ .n8n_smtp_port }}"
        NEXT_PRIVATE_SMTP_USERNAME: "{{ .n8n_smtp_user }}"
        NEXT_PRIVATE_SMTP_PASSWORD: "{{ .n8n_smtp_pass }}"
        # Must be a verified "Send mail as" alias of the authenticated Gmail
        # account, or Google rewrites From back to that account
        NEXT_PRIVATE_SMTP_FROM_ADDRESS: "sign@${SECRET_DOMAIN_2}"
        NEXT_PRIVATE_SMTP_FROM_NAME: Atrelix Technologies
        NEXT_PRIVATE_SMTP_SECURE: '{{ if eq .n8n_smtp_port "465" }}true{{ else }}false{{ end }}'
        # AI detection (Anthropic provider) — gateway URL lives in the
        # HelmRelease as ANTHROPIC_BASE_URL; see ATRELIX-CUSTOMIZATIONS.md
        # in the atrelix-sign fork
        ANTHROPIC_API_KEY: "{{ .documenso_api_key_claude }}"
        # Postgres Init
        INIT_POSTGRES_SUPER_USER: postgres
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: n8n
    - extract:
        key: cloudnative-pg
    - extract:
        key: documenso
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# STALE: documenso_api_key_claude actually holds the ANTHROPIC gateway key
# (mapped into the app above), so this secret is NOT a Documenso API token.
# The real token (ApiToken "claude-automation") lives in the manual secret
# documenso-api-token-claude. To finish: add it to the 1Password documenso
# item (e.g. field documenso_api_token), repoint the template below, then
# delete the manual secret.
# Retrieve: kubectl get secret -n default documenso-api-token-claude -o jsonpath='{.data.DOCUMENSO_API_TOKEN}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: documenso-api-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: documenso-api-token
    template:
      data:
        DOCUMENSO_API_TOKEN: "{{ .documenso_api_key_claude }}"
  dataFrom:
    - extract:
        key: documenso
