---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postal
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: postal-ext-secret
    template:
      data:
        # App-level values from the 1Password item "postal" — the single source
        # of truth (no app secrets in sops). Update there; ES syncs down.
        # Critical: RAILS_SECRET_KEY unset => new random key each boot (sessions die)
        RAILS_SECRET_KEY: "{{ .postal_rails_secret_key }}"
        # One MariaDB role serves both the main and the message databases
        MAIN_DB_PASSWORD: "{{ .postal_db_password }}"
        MESSAGE_DB_PASSWORD: "{{ .postal_db_password }}"
        # Google Workspace SMTP relay login used by the Postfix smart host
        # (a Gmail app password of a licensed Workspace user)
        RELAYHOST_USERNAME: "{{ .postal_relay_username }}"
        RELAYHOST_PASSWORD: "{{ .postal_relay_password }}"
  dataFrom:
    - extract:
        key: postal
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postal-signing-key
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: postal-signing-key
    template:
      data:
        # RSA key mounted at /secrets/signing.key. Never rotate: it is the
        # fallback DKIM key (d=rp.postal.<domain> s=postal) and signs webhooks.
        signing.key: "{{ .postal_signing_key }}"
  dataFrom:
    - extract:
        key: postal
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-root
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: mariadb-root-ext-secret
    template:
      data:
        # MariaDB root, consumed only by the init container that creates the
        # postal role/database (same 1Password item the StatefulSet uses)
        MARIADB_ROOT_PASSWORD: "{{ .mariadb_root_password }}"
  dataFrom:
    - extract:
        key: mariadb
