---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclip-atrelix
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: paperclip-atrelix-ext-secret
    template:
      data:
        # CNPG superuser creds consumed by the postgres-init initContainer,
        # which creates the app role/database on first start. Only the init
        # container takes this Secret via envFrom: Paperclip's agents inherit
        # the app container's environment, so the app container picks its keys
        # one by one (valueFrom) and never sees these.
        INIT_POSTGRES_SUPER_USER: postgres
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # App-level values from the 1Password item "paperclip-atrelix" — the
        # single source of truth. Update there; ES syncs down.
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: paperclip_atrelix
        INIT_POSTGRES_USER: "{{ .paperclip_postgres_user }}"
        INIT_POSTGRES_PASS: "{{ .paperclip_postgres_password }}"
        # urlquery: reserved characters in the password would otherwise break
        # the URL (postgres.js percent-decodes the userinfo)
        DATABASE_URL: "postgres://{{ .paperclip_postgres_user }}:{{ .paperclip_postgres_password | urlquery }}@postgres-rw.database.svc.cluster.local:5432/paperclip_atrelix"
        # Signs sessions and agent run JWTs; rotating it signs everyone out
        BETTER_AUTH_SECRET: "{{ .paperclip_better_auth_secret }}"
        # Signs approval-gated tool actions; rotate only with none pending
        PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "{{ .paperclip_tool_action_signing_secret }}"
        # Critical: never rotate — encrypts every secret Paperclip stores in
        # the database (provider logins, API keys), and a database restore
        # needs this exact key. Mounted as a file, not env: see helmrelease.yaml
        PAPERCLIP_SECRETS_MASTER_KEY: "{{ .paperclip_secrets_master_key }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: paperclip-atrelix
