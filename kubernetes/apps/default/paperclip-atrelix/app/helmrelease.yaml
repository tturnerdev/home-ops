---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperclip-atrelix
  namespace: default
spec:
  interval: 30m
  # The first install applies Paperclip's whole migration history (370 files
  # at 2026.1012.0) before the pod turns Ready; keep Helm's wait above the
  # startup probe's 10-minute window
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      paperclip-atrelix:
        annotations:
          reloader.stakater.com/auto: "true"
        # One replica only: RWO volume (workspaces, CLI logins) and an
        # in-process heartbeat scheduler. Never two pods.
        strategy: Recreate
        initContainers:
          init-db:
            image:
              repository: ghcr.io/onedr0p/postgres-init
              tag: 16.2
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: paperclip-atrelix-ext-secret
        containers:
          app:
            image:
              # https://github.com/paperclipai/paperclip — orchestrates AI agents
              # as a "company" (org chart, goals, budgets, approvals). Ships the
              # claude/codex/opencode/gemini CLIs its local adapters spawn in
              # this container. Stable channel (vYYYY.MDD.P release tags);
              # digest pins the multi-arch index.
              repository: ghcr.io/paperclipai/paperclip
              tag: 2026.1012.0@sha256:1661b3dd3fdf7a9b59542d1ced464c3faf9dc8309798b4d15a9923ed32795307
              pullPolicy: IfNotPresent
            env:
              TZ: America/Los_Angeles
              # Login required. "private" also enables the browser "Claim this
              # instance" first-admin flow, which is only safe because the
              # ingress below is internal-only.
              PAPERCLIP_DEPLOYMENT_MODE: authenticated
              PAPERCLIP_DEPLOYMENT_EXPOSURE: private
              # Canonical URL: auth base URL, invite links, and the private
              # hostname allowlist (any other Host header gets a 403)
              PAPERCLIP_PUBLIC_URL: "https://paperclip.${SECRET_DOMAIN_2}"
              # First admin claimed 2026-10-22; people join by invite from here
              # on. A fresh database needs this off again for the browser claim.
              PAPERCLIP_AUTH_DISABLE_SIGN_UP: "true"
              # No TTY to answer the pending-migrations prompt
              PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
              # The shared CNPG cluster's backups cover the database; skip
              # Paperclip's own periodic dumps onto the data volume
              PAPERCLIP_DB_BACKUP_ENABLED: "false"
              PAPERCLIP_TELEMETRY_DISABLED: "1"
              # ingress-nginx is the only proxy in front; its pod IPs move, so
              # trust the pod CIDR. TRUST_PROXY gives per-client rate-limit
              # budgets. The Claude subscription sign-in (Apps -> Connections)
              # ignores it and only returns its confidential responses over
              # direct TLS or from a CLAUDE_LOGIN_TRUSTED_PROXIES peer.
              TRUST_PROXY: &podCidr 10.42.0.0/16
              CLAUDE_LOGIN_TRUSTED_PROXIES: *podCidr
              # Local agents inherit this container's environment (the adapters
              # spawn them with process.env), so the key that decrypts every
              # stored secret comes from a file instead (master-key below)
              PAPERCLIP_SECRETS_MASTER_KEY_FILE: /var/run/secrets/paperclip/master.key
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: &secret paperclip-atrelix-ext-secret
                    key: DATABASE_URL
              BETTER_AUTH_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: BETTER_AUTH_SECRET
              PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: *secret
                    key: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
            probes:
              # TCP on purpose. /api/health returns 503 whenever Postgres is
              # unreachable, so a liveness probe there would restart the pod,
              # killing in-flight agent runs, on every CNPG failover.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3100
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: &health
                    path: /api/health
                    port: *port
                    # The private-hostname guard 403s every Host but the public
                    # one and loopback, and kubelet would send the pod IP
                    httpHeaders:
                      - name: Host
                        value: localhost
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 10
                  timeoutSeconds: 5
                  # 10 minutes: the first boot runs every migration
                  failureThreshold: 60
            # Root fs stays writable: agents and their CLIs write caches and
            # tool installs outside $HOME, and the image isn't built for a
            # read-only root
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                # The server plus one Node CLI process per concurrent agent run
                memory: 6Gi
    defaultPodOptions:
      # Paperclip never calls the Kubernetes API; don't hand agents a token
      automountServiceAccountToken: false
      # Upstream's stop budget: a shared 30s adapter-settlement window plus
      # final cleanup (docker/docker-compose.yml stop_grace_period)
      terminationGracePeriodSeconds: 90
      securityContext:
        # The image's `node` user (1000:1000). Started unprivileged, the
        # entrypoint skips its usermod/chown/gosu path and execs directly;
        # fsGroup makes the fresh volume writable instead.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: paperclip-atrelix
        ports:
          http:
            port: *port
    ingress:
      app:
        enabled: true
        # INTERNAL ONLY. Agents run unsandboxed in this pod with whatever
        # credentials they are given, and "private" exposure lets the first
        # signed-in browser claim instance admin. Not routed via cloudflared.
        # LAN DNS: unifi-dns publishes this host -> internal ingress alias.
        className: internal
        annotations:
          external-dns.alpha.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
          # The internal default cert only covers the primary domain, and the
          # secondary zone's HTTP-01 path only reaches tunnel-routed hosts, so
          # this host validates over DNS-01 (dnsNames solver in the ClusterIssuer)
          cert-manager.io/cluster-issuer: letsencrypt-production
          # Live-update websocket: nginx's 60s default would cut idle sockets
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        hosts:
          - host: &host "paperclip.${SECRET_DOMAIN_2}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: paperclip-atrelix-tls
            hosts: [*host]
    persistence:
      data:
        existingClaim: paperclip-atrelix-data
        advancedMounts:
          paperclip-atrelix:
            app:
              - path: /paperclip
      master-key:
        type: secret
        name: paperclip-atrelix-ext-secret
        # 0440 so the fsGroup can read it. Paperclip's chmod-to-0600 is best
        # effort (a secret volume is read-only); `doctor` flags the group bit.
        defaultMode: 288 # 0440 — parser-proof decimal (octal literals vary across kustomize/helm)
        items:
          - key: PAPERCLIP_SECRETS_MASTER_KEY
            path: master.key
        advancedMounts:
          paperclip-atrelix:
            app:
              - path: /var/run/secrets/paperclip
                readOnly: true
