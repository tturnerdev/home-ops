---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: photoprism
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      photoprism:
        # initContainers:
        #   init-db:
        #     image:
        #       repository: ghcr.io/onedr0p/postgres-init
        #       tag: 16.2
        #       pullPolicy: IfNotPresent
        #     envFrom:
        #       - secretRef:
        #           name: photoprism-secret
        containers:
          app:
            image:
              repository: docker.io/photoprism/photoprism
              tag: latest@sha256:9409cf8e5a6ebcbe3170d14537556cbc20997aaa307096d6eeedbfc5eeef6719
              pullPolicy: IfNotPresent
            env:
              TZ: "America/Los_Angeles"
              HOME: /photoprism
              PHOTOPRISM_PUBLIC: "false"
              # PHOTOPRISM_UID: "568"
              # PHOTOPRISM_GID: "568"
              # PHOTOPRISM_UMASK: "0022"
              # Database
              # PHOTOPRISM_DATABASE_DRIVER: postgres
              # PHOTOPRISM_DATABASE_SERVER: "postgres-rw.database.svc.cluster.local:5432"
              # PHOTOPRISM_DATABASE_NAME: photoprism
              # PHOTOPRISM_DATABASE_USER:
              #   valueFrom:
              #     secretKeyRef:
              #       name: photoprism-secret
              #       key: POSTGRES_USER
              # PHOTOPRISM_DATABASE_PASSWORD:
              #   valueFrom:
              #     secretKeyRef:
              #       name: photoprism-secret
              #       key: POSTGRES_PASSWORD
              # Admin credentials
              PHOTOPRISM_ADMIN_USER: admin
              PHOTOPRISM_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: photoprism-secret
                    key: PHOTOPRISM_ADMIN_PASSWORD
              # Paths
              PHOTOPRISM_STORAGE_PATH: /assets/storage
              PHOTOPRISM_SIDECAR_PATH: /assets/sidecar
              PHOTOPRISM_CONFIG_PATH: /assets/config
              PHOTOPRISM_CACHE_PATH: /assets/cache
              PHOTOPRISM_ORIGINALS_PATH: /photoprism/originals
              PHOTOPRISM_IMPORT_PATH: /photoprism/import
              PHOTOPRISM_TEMP_PATH: /photoprism/temp
              PHOTOPRISM_BACKUP_PATH: /assets/backup
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
            # securityContext:
            #   allowPrivilegeEscalation: false
            #   readOnlyRootFilesystem: false
            #   capabilities:
            #     drop:
            #       - ALL
    # defaultPodOptions:
    #   securityContext:
    #     runAsNonRoot: true
    #     runAsUser: 568
    #     runAsGroup: 568
    #     fsGroup: 568
    #     fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: photoprism
        ports:
          http:
            port: 2342
    route:
      app:
        # Large uploads: Envoy applies no request-body limit (nginx had proxy-body-size 0).
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Media"
          gethomepage.dev/name: "PhotoPrism"
          gethomepage.dev/icon: "photoprism.svg"
          gethomepage.dev/description: "Photos"
        hostnames:
          - "photos.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 2342
    persistence:
      assets:
        enabled: true
        existingClaim: photoprism-assets
        globalMounts:
          - path: /assets
      originals:
        enabled: true
        existingClaim: photoprism-originals
        globalMounts:
          - path: /photoprism/originals
      import:
        enabled: true
        existingClaim: photoprism-import
        globalMounts:
          - path: /photoprism/import
      temp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /photoprism/temp