---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-portal
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: agent-portal-ext-secret
    template:
      data:
        # CNPG superuser creds consumed by the postgres-init initContainer,
        # which creates the app role/database on first start. Only the init
        # container takes this Secret via envFrom; the app container picks its
        # keys one by one (valueFrom) and never sees the superuser password.
        INIT_POSTGRES_SUPER_USER: postgres
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # App-level values from the 1Password item "agent-portal" — the single
        # source of truth. Update there; ES syncs down.
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: agent_portal
        INIT_POSTGRES_USER: "{{ .agent_portal_postgres_user }}"
        INIT_POSTGRES_PASS: "{{ .agent_portal_postgres_password }}"
        # urlquery: reserved characters in the password would otherwise break
        # the URL (SQLAlchemy percent-decodes the userinfo)
        PORTAL_DATABASE_URL: "postgresql+asyncpg://{{ .agent_portal_postgres_user }}:{{ .agent_portal_postgres_password | urlquery }}@postgres-rw.database.svc.cluster.local:5432/agent_portal"
        # Set once and keep: the portal will sign links and encrypt stored
        # secrets with it
        PORTAL_SECRET_KEY: "{{ .agent_portal_secret_key }}"
        # First-run bootstrap only: creates this administrator while the
        # database has no account. Change the password after the first sign-in;
        # these two are not read again.
        PORTAL_ADMIN_EMAIL: "{{ .agent_portal_admin_email }}"
        PORTAL_ADMIN_PASSWORD: "{{ .agent_portal_admin_password }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: agent-portal
