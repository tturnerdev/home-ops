---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inbox-zero
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: inbox-zero-ext-secret
    template:
      data:
        # CNPG superuser creds consumed by the postgres-init initContainer,
        # which creates the app role/database on first start
        INIT_POSTGRES_SUPER_USER: postgres
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # App-level values from the 1Password item "inbox-zero" — the single
        # source of truth (no app secrets in sops). Update there; ES syncs down.
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: inbox_zero
        INIT_POSTGRES_USER: "{{ .inbox_zero_postgres_user }}"
        INIT_POSTGRES_PASS: "{{ .inbox_zero_postgres_password }}"
        DATABASE_URL: "postgresql://{{ .inbox_zero_postgres_user }}:{{ .inbox_zero_postgres_password }}@postgres-rw.database.svc.cluster.local:5432/inbox_zero?schema=public"
        DIRECT_URL: "postgresql://{{ .inbox_zero_postgres_user }}:{{ .inbox_zero_postgres_password }}@postgres-rw.database.svc.cluster.local:5432/inbox_zero?schema=public"
        AUTH_SECRET: "{{ .inbox_zero_auth_secret }}"
        # Critical: never rotate — encrypt stored Gmail OAuth tokens
        EMAIL_ENCRYPT_SECRET: "{{ .inbox_zero_email_encrypt_secret }}"
        EMAIL_ENCRYPT_SALT: "{{ .inbox_zero_email_encrypt_salt }}"
        INTERNAL_API_KEY: "{{ .inbox_zero_internal_api_key }}"
        API_KEY_SALT: "{{ .inbox_zero_api_key_salt }}"
        # Bearer token the CronJobs present to /api/cron/* and /api/watch/all
        CRON_SECRET: "{{ .inbox_zero_cron_secret }}"
        # Shared by the app (client) and the serverless-redis-http bridge (server)
        UPSTASH_REDIS_TOKEN: "{{ .inbox_zero_upstash_redis_token }}"
        SRH_CONNECTION_STRING: "redis://dragonfly.database.svc.cluster.local:6379/0"
        # Also baked into the Pub/Sub push subscription URL (?token=...)
        GOOGLE_PUBSUB_VERIFICATION_TOKEN: "{{ .inbox_zero_pubsub_verification_token }}"
        GOOGLE_PUBSUB_TOPIC_NAME: "projects/{{ .inbox_zero_gcp_project_id }}/topics/gmail-push"
        HEALTH_API_KEY: "{{ .inbox_zero_health_api_key }}"
        # Human-supplied (GCP OAuth client, Anthropic console)
        GOOGLE_CLIENT_ID: "{{ .inbox_zero_google_client_id }}"
        GOOGLE_CLIENT_SECRET: "{{ .inbox_zero_google_client_secret }}"
        ANTHROPIC_API_KEY: "{{ .inbox_zero_anthropic_api_key }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: inbox-zero
