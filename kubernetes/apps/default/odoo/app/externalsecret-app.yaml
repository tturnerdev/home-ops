---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
#
# STAGED, NOT ACTIVE. odoo-secret is currently rendered from ./secret.sops.yaml
# (1Password item creation isn't possible through the Connect server the cluster
# uses — see the dario app for the same pattern). To move to 1Password:
#   1. Create item "odoo" in vault "Home-Ops Default" with fields
#      odoo_db_password, odoo_admin_passwd and odoo_admin_login_password
#      (values: `sops -d secret.sops.yaml`).
#      Do NOT rotate odoo_db_password casually — the initContainer re-ALTERs the
#      role on every start, so it is self-healing, but a mismatch mid-flight
#      makes the app container fail its wait-for-psql.
#   2. Uncomment this file in kustomization.yaml and delete secret.sops.yaml.
#   Flux prunes the SOPS Secret and ES creates the same-named one; reloader
#   restarts the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: odoo-secret
    template:
      data:
        ODOO_DB_PASSWORD: "{{ .odoo_db_password }}"
        ODOO_ADMIN_PASSWD: "{{ .odoo_admin_passwd }}"
        ADMIN_LOGIN_PASSWORD: "{{ .odoo_admin_login_password }}"
  dataFrom:
    - extract:
        key: odoo
