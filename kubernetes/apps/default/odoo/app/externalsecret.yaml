---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
#
# CloudNativePG superuser credentials, consumed ONLY by the `init-db-role`
# initContainer (which creates the dedicated `odoo` role). They never reach the
# Odoo container: Odoo refuses to start as the `postgres` user
# (check_postgres_user() in odoo/cli/server.py does sys.exit(1)).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo-cnpg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: odoo-cnpg-secret
    template:
      data:
        INIT_POSTGRES_SUPER_USER: postgres
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
