---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: erpnext
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  # helm-controller defaults to 5m with wait: true; a first-run
  # `bench new-site --install-app erpnext` takes 3-8 minutes on top of a
  # ~2.5 GB image pull.
  timeout: 20m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      # NO automatic rollback. 03-create-site runs `bench migrate` on every start,
      # so by the time an upgrade fails the database is already migrated. Rolling
      # the digest back would put OLD code on a NEW schema — exactly the downgrade
      # the README calls unsafe. A failed upgrade stays failed, for a human.
      retries: 0
      remediateLastFailure: false
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        # `frappe:x:1000:1000::/home/frappe:/bin/bash` in the image; frappe_docker
        # pins it (`useradd -u 1000 -g 1000 frappe`). fsGroup makes the fresh
        # ceph-block PVC writable: the kubelet chowns it root:1000 setgid g+rwx.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      erpnext:
        # No reloader annotation on purpose: both Secrets are consumed only by
        # the 03-create-site init container, so a rotation would otherwise
        # trigger a needless Recreate + bench migrate of the whole ERP.
        # One RWO PVC shared by eight frappe containers in one pod. RWO restricts
        # a volume to one NODE, not one pod — collapsing the six upstream
        # Deployments into one pod is what removes the ReadWriteMany requirement
        # the official frappe/helm chart has. The database is CloudNativePG.
        replicas: 1
        strategy: Recreate
        pod:
          # The 30s default is shared across ALL containers. Let an in-flight RQ
          # job (bench worker does a warm shutdown on SIGTERM) finish on rollout.
          # NOTE: only terminationGracePeriodSeconds is set here — adding
          # `securityContext` at this level would REPLACE defaultPodOptions'
          # wholesale (app-template's getOption assigns, it does not merge) and
          # silently drop fsGroup, leaving the PVC unwritable.
          terminationGracePeriodSeconds: 180
        initContainers:
          # 01 is a Kubernetes NATIVE SIDECAR: an initContainer with
          # `restartPolicy: Always` PLUS a startupProbe. The kubelet gates the
          # next init container on the startup probe succeeding — and ONLY if a
          # startupProbe is present (`if container.StartupProbe != nil`). Omitting
          # it removes the ordering gate entirely.
          # `custom: true` is mandatory for a different reason: a NON-custom probe
          # is built from the controller's PRIMARY Service port, and this controller
          # has one (service `app`, port 8080). The sidecar would end up
          # start-probing nginx's port instead of its own, so the gate would open
          # at the wrong time or never. (The chart's drop-the-probe-entirely path
          # applies only to a controller with no Service at all.)
          01-valkey:
            restartPolicy: Always
            image:
              # Note the repo is valkey/valkey, not library/valkey.
              repository: docker.io/valkey/valkey
              tag: "9.1.3-alpine"
              pullPolicy: IfNotPresent
            securityContext: &hardened
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              # readOnlyRootFilesystem stays off: the frappe ENTRYPOINT rewrites
              # sites/assets and nginx writes /var/lib/nginx and /run/nginx.pid.
            # Frappe needs exactly two logical endpoints, redis_cache and
            # redis_queue; redis_socketio has been dead since v15. Both point here
            # with no database index: cache keys are namespaced `{db_name}|…` and
            # queue keys are `rq:…`, so they cannot collide.
            # noeviction is deliberate — an LRU policy could evict `rq:*` job keys
            # under cache pressure and silently drop background jobs.
            # --bind 127.0.0.1: RQ deserializes job payloads with pickle, so an
            # unauthenticated Valkey reachable from other pods is remote code
            # execution in the workers. All consumers are inside this netns, and
            # there are no NetworkPolicies on this cluster.
            args: ["--bind", "127.0.0.1", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  # exec, NOT tcpSocket: a tcpSocket probe has no `host`, so the
                  # kubelet dials status.PodIP from the node — which a
                  # loopback-bound server never answers. The sidecar would restart
                  # forever and the init gate would never open.
                  exec:
                    command: ["valkey-cli", "-h", "127.0.0.1", "ping"]
                  periodSeconds: 2
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
          # Ordinary init containers from here: they run to completion, in order.
          02-configurator:
            image: &img
              # `develop` is the dev/nightly stream (v17.0.0-dev), rebuilt weekly
              # on Mondays 03:17 UTC after the compose integration suite passes.
              # Both `develop` and `latest` are mutable, and there is no v17.x tag,
              # so the only way to pin is by digest.
              # PostgreSQL support for ERPNext only reached parity on develop
              # (frappe/erpnext#24389, closed 2026-06-21) — do NOT swap in a v16 or
              # v15 tag: those branches never got it.
              repository: docker.io/frappe/erpnext
              tag: "develop@sha256:dbe1dcbfd696202b960d52ccef982d9760ffc9f7a5ab6ce6a6e9ec89b7253d19"
              pullPolicy: IfNotPresent
            # `command:` here on purpose — it REPLACES the image ENTRYPOINT, which
            # exists only to rebuild the sites/assets symlink. The long-running
            # containers below must NOT do that (see their comment).
            command: ["bash", "-c"]
            securityContext: *hardened
            args:
              - |
                set -e
                # MUST be first: get_file_items(sites/apps.txt, raise_not_found=True)
                # is reached from bench_helper.get_apps(), which builds the click
                # command tree for EVERY bench invocation. Without it the bench CLI
                # itself cannot start. A fresh PVC mounted over sites/ hides the
                # copies the image ships — Kubernetes does not seed empty volumes
                # from image content the way Docker named volumes do.
                ls -1 apps > sites/apps.txt
                # `bench set-config -g` opens common_site_config.json in READ mode
                # with no existence check, so the first call raises FileNotFoundError
                # on an empty PVC.
                [ -f sites/common_site_config.json ] || echo '{}' > sites/common_site_config.json
                # CloudNativePG. frappe's get_db() switches driver on db_type, and
                # the postgres driver defaults the port to 5432 anyway.
                bench set-config -g  db_type postgres
                bench set-config -g  db_host "$DB_HOST"
                bench set-config -gp db_port 5432
                bench set-config -g  redis_cache "redis://127.0.0.1:6379"
                bench set-config -g  redis_queue "redis://127.0.0.1:6379"
                bench set-config -g  redis_socketio "redis://127.0.0.1:6379"
                bench set-config -gp socketio_port 9000
                bench set-config -g  webserver_host 127.0.0.1
                bench set-config -gp webserver_port 8000
                bench set-config -g  chromium_path /usr/bin/chromium-headless-shell
                # frappe's Python realtime server (asyncio + uvicorn,
                # frappe/realtime/server.py) instead of the legacy node
                # socketio.js. This is the one genuinely bleeding-edge knob the
                # image exposes: `bench socketio` (bench 5.31.0) reads this key
                # and execs `env/bin/python -m frappe.realtime.server` when the
                # module is present (it is), falling back to node otherwise. It
                # reads the same keys as node (socketio_port, redis_queue,
                # webserver_host/port). Revert = set this to node; the key lives
                # in common_site_config.json on the PVC, so it must be re-set here,
                # not merely removed.
                bench set-config -g  socketio_backend python
                echo "common_site_config.json configured"
            env:
              TZ: "America/Los_Angeles"
              DB_HOST: &dbHost postgres-rw.database.svc.cluster.local
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
          03-create-site:
            image: *img
            command: ["bash", "-c"]
            securityContext: *hardened
            # Bare $VARS on purpose: Flux postBuild substitutes the braced form
            # and would blank them. Verified with `flux envsubst`: bare $VAR and
            # $(cmd) pass through untouched.
            args:
              - |
                set -e
                SITE="$SITE_NAME"
                SENTINEL="sites/$SITE/.bootstrap-complete"
                # bash is PID 1 here and only runs a trap once the foreground
                # command returns, so long bench calls run in the background and
                # are awaited (wait is interruptible): a delete mid-bootstrap is
                # then honoured instead of burning the grace period, and the
                # sentinel/orphan-drop logic below handles the interrupted attempt.
                child=""
                trap 'kill -TERM "$child" 2>/dev/null; exit 143' TERM INT
                run() { "$@" & child=$!; wait "$child"; }
                until jq -e '.db_host and .redis_queue' sites/common_site_config.json >/dev/null 2>&1; do
                  echo "waiting for common_site_config.json"; sleep 2
                done
                wait-for-it -t 300 "$DB_HOST:5432"
                # Backstop for the native-sidecar ordering gate, which is Beta (on
                # by default) on Kubernetes 1.32, not GA.
                wait-for-it -t 60 127.0.0.1:6379
                psql_root() { PGPASSWORD="$POSTGRES_ROOT_PASSWORD" psql -h "$DB_HOST" -U "$POSTGRES_ROOT_USER" -v ON_ERROR_STOP=1 -q "$@"; }
                if [ -f "$SENTINEL" ]; then
                  echo "site $SITE already bootstrapped"
                  # No `bench backup` here, deliberately: the image ships pg_dump
                  # 15.19 and CloudNativePG runs 17.x, and pg_dump refuses a newer
                  # server ("aborting because of server version mismatch" — verified).
                  # The database is inside the cluster-wide daily barman backup with
                  # WAL archiving to Ceph RGW, which is a better backup than a local
                  # dump on the same PVC would be. `bench migrate` is one-way and
                  # Flux will NOT roll the image back (upgrade.remediation above).
                  run bench --site "$SITE" migrate
                else
                  # No sentinel => a previous attempt never completed. _new_site()
                  # writes site_config.json BEFORE it contacts the database and its
                  # rollback is gated on sys.__stdin__.isatty() (false in a
                  # container), so one transient failure would poison a naive
                  # `test -d` guard forever.
                  #
                  # That half-built attempt also left an orphaned database and role
                  # behind on CNPG (frappe names both _<16 hex>), which nothing else
                  # ever cleans up. Drop them before retrying — the same statements
                  # frappe's own drop_user_and_database() runs. The DROP gates the
                  # rm -rf: site_config.json is the only record of the orphan's
                  # name, so a failed DROP must exit here (the kubelet retries with
                  # backoff) rather than destroy that record and move on.
                  OLD_DB=$(jq -r '.db_name // empty' "sites/$SITE/site_config.json" 2>/dev/null || true)
                  if [ -n "$OLD_DB" ]; then
                    echo "dropping orphaned database/role $OLD_DB left by a failed attempt"
                    psql_root -d postgres -c "DROP DATABASE IF EXISTS \"$OLD_DB\";" -c "DROP ROLE IF EXISTS \"$OLD_DB\";"
                  fi
                  rm -rf "sites/$SITE"
                  # NEVER add --force: setup_database() drops the database first,
                  # so a pod restart would wipe the ERP.
                  # The root login creates the per-site role and database (CREATE
                  # USER / CREATE DATABASE / ALTER DATABASE OWNER, then GRANT ON
                  # SCHEMA public) and is used for nothing else; the site itself
                  # connects as the generated _<16 hex> role. The image's psql 15
                  # restores the bootstrap SQL into a 17.x server without complaint
                  # (only pg_dump is version-strict).
                  # The superuser password goes in on STDIN, not argv: with no
                  # --db-root-password, get_root_connection() falls through to
                  # getpass(), which reads one line from the pipe when there is no
                  # tty. bench logs every invocation's full argv to logs/bench.log
                  # (a CRI host directory that outlives the container), and argv is
                  # readable in /proc — neither should ever hold the CNPG superuser.
                  printf '%s\n' "$POSTGRES_ROOT_PASSWORD" | run bench new-site "$SITE" \
                    --db-type postgres --db-host "$DB_HOST" --db-port 5432 \
                    --db-root-username "$POSTGRES_ROOT_USER" \
                    --admin-password "$ADMIN_PASSWORD" \
                    --install-app erpnext --set-default
                  touch "$SENTINEL"
                  # ---- post-bootstrap hardening, AFTER the sentinel: a failure ----
                  # ---- here must not trigger the destructive retry above.      ----
                  DB=$(jq -r .db_name "sites/$SITE/site_config.json")
                  # setup_db.py's "best-effort" GRANT pg_read_all_stats and CREATE
                  # EXTENSION pg_stat_statements both SUCCEED on CNPG (the extension
                  # needs only superuser; the preload is checked at query time).
                  # pg_read_all_stats lets this role read the live query text of
                  # every other tenant on the shared cluster. Revoke it, and drop
                  # the extension, which is inert without shared_preload_libraries.
                  psql_root -d postgres -c "REVOKE pg_read_all_stats FROM \"$DB\";" \
                    && psql_root -d "$DB" -c "DROP EXTENSION IF EXISTS pg_stat_statements;" \
                    || echo "WARNING: could not revoke pg_read_all_stats / drop pg_stat_statements for $DB"
                  # frappe's DDL log wrote CREATE USER ... PASSWORD for the site
                  # role into sites/<site>/logs/database.log* — on the PVC, next
                  # to site_config.json. The bootstrap logs are only CREATE TABLE
                  # noise; remove them.
                  rm -f "sites/$SITE/logs/database.log"*
                  # System Settings ships no time_zone and frappe falls back to
                  # Asia/Kolkata. Setting it LATER is a trap: every Scheduled Job
                  # Type was stamped in IST at creation, and the scheduler's cold
                  # start computes the next run from that stamp — moving the site
                  # clock back 12.5 h means nothing is due for 12.5 h, silently.
                  # So set the zone now and re-base last_execution to the same
                  # local clock the scheduler compares against.
                  run bench --site "$SITE" execute frappe.db.set_single_value \
                    --args "['System Settings','time_zone','$SITE_TZ']" \
                    && psql_root -d "$DB" -c "UPDATE \"tabScheduled Job Type\" SET last_execution = (now() AT TIME ZONE '$SITE_TZ');" \
                    || echo "WARNING: could not set time_zone / re-base scheduler"
                fi
                bench --site "$SITE" set-maintenance-mode off
                # MANDATORY, not optional. _new_site() probes a database that does
                # not exist yet, swallows the exception and disables the scheduler.
                # Without this, `bench schedule` runs forever and enqueues NOTHING
                # — no email queue, no auto-repeat — and logs no error.
                bench --site "$SITE" enable-scheduler
                echo "site $SITE ready"
            env:
              TZ: "America/Los_Angeles"
              SITE_NAME: "erpnext.${SECRET_DOMAIN}"
              SITE_TZ: "America/Los_Angeles"
              DB_HOST: *dbHost
            envFrom:
              - secretRef:
                  name: erpnext-secret # ADMIN_PASSWORD
              # CNPG superuser — this init container is the ONLY place it is
              # mounted. The long-running containers never see it.
              - secretRef:
                  name: erpnext-cnpg-secret # POSTGRES_ROOT_USER / POSTGRES_ROOT_PASSWORD
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                # Memory peak of the whole deploy. An OOMKill here is what leaves a
                # half-built site directory behind (which the sentinel then cleans).
                memory: 2Gi
        # Every long-running container below uses `args:` and NEVER `command:`.
        # Docker Compose's `command:` maps to CMD and leaves the ENTRYPOINT in
        # place; Kubernetes `command:` REPLACES it. The ENTRYPOINT is:
        #   rm -rf sites/assets && ln -s /home/frappe/frappe-bench/assets sites/assets
        # Since frappe_docker 64e6536 the built assets exist ONLY in the image
        # layer, so that symlink is the only way nginx can find them. Setting
        # `command:` here makes every CSS/JS bundle 404 — an unstyled login page
        # that looks like a CSS or ingress fault.
        containers:
          backend:
            image: *img
            securityContext: *hardened
            # No args: the image CMD is start.sh, which execs gunicorn on :8000.
            env: &frappeEnv
              TZ: "America/Los_Angeles"
            probes:
              liveness: &backendProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 8000 }
                  initialDelaySeconds: 15
                  periodSeconds: 10
              readiness: *backendProbe
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 2Gi
          frontend:
            image: *img
            securityContext: *hardened
            # nginx binds 8080 — unprivileged, so no NET_BIND_SERVICE needed.
            args: ["nginx-entrypoint.sh"]
            lifecycle:
              preStop:
                exec:
                  # nginx-entrypoint.sh ends with a bare `nginx -g 'daemon off;'`
                  # — no exec — so PID 1 is bash, and a PID 1 gets no default
                  # signal action: SIGTERM is simply ignored and the container
                  # burns the whole terminationGracePeriod (measured: nginx still
                  # answering 2 minutes after the pod was deleted, and the RWO
                  # volume held for the full 180s on every Recreate rollout).
                  # `stop` (SIGTERM to the master via /run/nginx.pid), not `quit`:
                  # a graceful quit waits for open socket.io websockets from
                  # browser tabs and would burn the grace all over again.
                  command: ["nginx", "-s", "stop"]
            env:
              TZ: "America/Los_Angeles"
              BACKEND: "127.0.0.1:8000"
              SOCKETIO: "127.0.0.1:9000"
              UPSTREAM_REAL_IP_ADDRESS: "10.42.0.0/16"
              UPSTREAM_REAL_IP_HEADER: "X-Forwarded-For"
              UPSTREAM_REAL_IP_RECURSIVE: "off"
              PROXY_READ_TIMEOUT: "120"
              CLIENT_MAX_BODY_SIZE: "100m"
              # FRAPPE_SITE_NAME_HEADER deliberately UNSET so it defaults to the
              # literal `$host`. The site is named exactly erpnext.${SECRET_DOMAIN},
              # so Host == Origin == X-Frappe-Site-Name == the site directory name
              # == the socket.io namespace, and all four checks line up with no
              # special-casing. Pinning it to a literal that differs from the
              # browser Host makes nginx emit a mismatched Origin and socket.io
              # rejects every connection ("Invalid origin") — which is exactly why
              # upstream's own pwd.yml has broken realtime.
            probes:
              # The Host header is MANDATORY. Without it the kubelet sends the pod
              # IP, nginx forwards X-Frappe-Site-Name: 10.42.x.y, and frappe.init()
              # raises IncorrectSitePath (a werkzeug NotFound) — HTTP 404
              # "<host> does not exist." forever, so the pod never goes Ready.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &ping
                    path: /api/method/ping
                    port: 8080
                    httpHeaders:
                      - name: Host
                        value: "erpnext.${SECRET_DOMAIN}"
                  periodSeconds: 5
                  timeoutSeconds: 5
                  # 300s for gunicorn --preload to import frappe + erpnext
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *ping
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 8080 }
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
          websocket:
            image: *img
            securityContext: *hardened
            # `bench socketio` reads `socketio_backend` from common_site_config
            # (set to "python" by 02-configurator) and execs
            # `env/bin/python -m frappe.realtime.server` — uvicorn installs
            # SIGTERM/SIGINT handlers on its main thread, so it exits cleanly even
            # as PID 1 (verified: gone within 3s of SIGTERM). If the module ever
            # disappears from a weekly build it falls back to
            # `node apps/frappe/socketio.js` (python -> node only, never the
            # reverse), and node as PID 1 does NOT exit on SIGTERM: its own
            # handler resets the disposition and re-raises, which the kernel
            # ignores for an init process — measured via the node's CRI view,
            # it ran out the whole 180s grace on every rollout. Hence the bash
            # wrapper stays: as a child of a trapping bash either backend gets a
            # real SIGTERM. A preStop cannot do this (no tini/dumb-init in the
            # image; SIGKILL to an init from inside its pid namespace is
            # ignored). The ENTRYPOINT still runs first (assets symlink), because
            # this is args:, not command:.
            args:
              - bash
              - -c
              - |
                trap 'kill -TERM "$child" 2>/dev/null; wait "$child"' TERM INT
                bench socketio &
                child=$!
                wait "$child"
            env: *frappeEnv
            probes:
              liveness: &wsProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket: { port: 9000 }
                  initialDelaySeconds: 10
                  periodSeconds: 10
              readiness: *wsProbe
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
          scheduler:
            image: *img
            securityContext: *hardened
            args: ["bench", "schedule"]
            env: *frappeEnv
            lifecycle:
              preStop:
                exec:
                  # start_scheduler() is `while True: time.sleep(...)` with no
                  # signal handling, running as PID 1 — so SIGTERM is ignored and
                  # it burns the whole grace period too. Python does install a
                  # SIGINT handler (KeyboardInterrupt), so that is the exit path.
                  # bash builtin kill: the image has no /bin/kill on PATH.
                  command: ["bash", "-c", "kill -INT 1"]
            probes:
              # No listening port. Mirrors frappe/helm's worker.healthProbe, but
              # checks ONLY the in-pod Valkey: restarting a worker cannot fix an
              # unreachable database, and a wait-for-it exec probe against CNPG
              # every 15s from three containers would write one "incomplete
              # startup packet" LOG line per probe (its /dev/tcp path sends a
              # newline before closing; a kubelet tcpSocket probe would be silent
              # but equally pointless).
              # Do NOT use `healthcheck.sh --ping-service` — that script is not in
              # the frappe image and the probe would fail with "executable file not
              # found", crashlooping an otherwise healthy worker.
              liveness: &workerProbe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["wait-for-it", "-t", "1", "127.0.0.1:6379"]
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 192Mi
              limits:
                memory: 384Mi
          # short/default/long are the only built-in queues and frappe asserts it.
          # Order on the command line is RQ priority order.
          queue-short:
            image: *img
            securityContext: *hardened
            args: ["bench", "worker", "--queue", "short,default"]
            env: *frappeEnv
            probes:
              liveness: *workerProbe
            resources:
              requests:
                cpu: 50m
                memory: 384Mi
              limits:
                memory: 768Mi
          queue-long:
            image: *img
            securityContext: *hardened
            args: ["bench", "worker", "--queue", "long,default,short"]
            env: *frappeEnv
            probes:
              liveness: *workerProbe
            resources:
              requests:
                cpu: 50m
                memory: 384Mi
              limits:
                memory: 768Mi
    service:
      # Only the nginx frontend is exposed. gunicorn (8000) and socket.io (9000)
      # are reached over pod-local loopback by nginx and must not be in the
      # Service. The browser connects socket.io to window.location.origin on the
      # default /socket.io path, so one port and one `/` Prefix path cover
      # /socket.io, /assets, /files and /api too.
      app:
        controller: erpnext
        primary: true
        ports:
          http:
            port: 8080
    route:
      app:
        # frappe's socket.io rides the same port and path; WebSocket upgrades are on
        # by default and the Gateways' BackendTrafficPolicy disables the request and
        # stream-idle timeouts (nginx needed 3600s to clear socket.io's 55s idle).
        hostnames:
          - "erpnext.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    persistence:
      # A typo'd CONTROLLER key is a hard template failure, but a typo'd CONTAINER
      # key is SILENT — the volume is added to the pod and simply never mounted.
      sites:
        existingClaim: erpnext-sites
        advancedMounts:
          erpnext:
            02-configurator: [{ path: &sites /home/frappe/frappe-bench/sites }]
            03-create-site: [{ path: *sites }]
            backend: [{ path: *sites }]
            frontend: [{ path: *sites }]
            websocket: [{ path: *sites }]
            scheduler: [{ path: *sites }]
