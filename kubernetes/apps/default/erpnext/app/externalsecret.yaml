---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
#
# STAGED, NOT ACTIVE. erpnext-secret is currently rendered from
# ./secret.sops.yaml (1Password item creation isn't possible through the Connect
# server the cluster uses — same pattern as the dario app). To move to 1Password:
#   1. Create item "erpnext" in vault "Home-Ops Default" with the field
#      erpnext_admin_password (value: `sops -d secret.sops.yaml`). It is only
#      read on the boot that creates the site; change the Administrator password
#      in the UI afterwards, not here.
#   2. Uncomment this file in kustomization.yaml and delete secret.sops.yaml.
#      ks.yaml already dependsOn external-secrets.
# The CNPG superuser is a separate, already-active ExternalSecret
# (externalsecret-cnpg.yaml) drawn from the shared "cloudnative-pg" item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: erpnext-secret
    template:
      data:
        ADMIN_PASSWORD: "{{ .erpnext_admin_password }}"
  dataFrom:
    - extract:
        key: erpnext
