---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
#
# STAGED, NOT ACTIVE. erpnext-secret is currently rendered from
# ./secret.sops.yaml (1Password item creation isn't possible through the Connect
# server the cluster uses — same pattern as the dario app). To move to 1Password:
#   1. Create item "erpnext" in vault "Home-Ops Default" with fields
#      erpnext_mariadb_root_password and erpnext_admin_password
#      (values: `sops -d secret.sops.yaml`).
#      Do NOT change erpnext_mariadb_root_password: the MariaDB entrypoint only
#      provisions root on the FIRST init of an empty datadir, so a new value
#      would not be applied and `bench new-site` would fail to authenticate.
#      Rotate inside MariaDB (ALTER USER) and update the item to match.
#   2. Uncomment this file in kustomization.yaml and delete secret.sops.yaml.
#      ks.yaml already dependsOn external-secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: erpnext-secret
    template:
      data:
        MARIADB_ROOT_PASSWORD: "{{ .erpnext_mariadb_root_password }}"
        ADMIN_PASSWORD: "{{ .erpnext_admin_password }}"
  dataFrom:
    - extract:
        key: erpnext
