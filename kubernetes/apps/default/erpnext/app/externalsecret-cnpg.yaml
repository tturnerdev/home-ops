---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
#
# CloudNativePG superuser credentials, consumed ONLY by the `03-create-site`
# initContainer. `bench new-site --db-type postgres` needs a login that can
# CREATE USER / CREATE DATABASE / ALTER DATABASE OWNER for the per-site role and
# database it generates (frappe/database/postgres/setup_db.py), and to drop an
# orphaned pair on retry. The long-running containers never mount this secret —
# the site connects as its own generated `_<16 hex>` role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext-cnpg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: erpnext-cnpg-secret
    template:
      data:
        POSTGRES_ROOT_USER: postgres
        POSTGRES_ROOT_PASSWORD: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
