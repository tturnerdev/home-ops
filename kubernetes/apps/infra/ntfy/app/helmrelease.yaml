---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
spec:
  interval: 2m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: envoy-gateway
      namespace: network
  values:
    controllers:
      ntfy:
        containers:
          app:
            image:
              repository: docker.io/binwiederhier/ntfy
              tag: v2.37.1@sha256:a1dde1f3210b68ac0c29e53298c96a988d06c320d1201d72f3e8e224d1a546f3
              pullPolicy: IfNotPresent
            args:
              - serve
    service:
      # Configure a service for the main application
      app:
        controller: ntfy
        type: ClusterIP
        ports:
          http:
            port: 80
    route:
      app:
        # ntfy subscriptions are long-lived SSE/WebSocket streams: the Gateways'
        # BackendTrafficPolicy disables the request and stream-idle timeouts.
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 80
