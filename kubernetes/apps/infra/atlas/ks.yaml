---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The Home-Ops Atlas page and its live-facts collector live in the private
# companion repository home-ops-working-and-docs, which Flux reads as the
# GitRepository home-ops-working (source.yaml). atlas serves the page;
# atlas-live (the scheduled collector) stays suspended: refresh is manual.
# Runbook: docs/atlas.md in that repository.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app atlas
  namespace: &namespace infra
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./atlas/app
  # Substitution fills config.json with the zones and the Postgres address for
  # the in-cluster copy; the generated ConfigMaps carry substitute: disabled.
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: home-ops-working
    namespace: infra
  targetNamespace: *namespace
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The CronJob that collects live facts and pushes live.json to the private
# repository. No postBuild on purpose: live.sh is full of shell ${VAR}s.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app atlas-live
  namespace: &namespace infra
spec:
  suspend: true
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  interval: 1h
  path: ./atlas/cronjob
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: home-ops-working
    namespace: infra
  targetNamespace: *namespace
  timeout: 5m
  wait: false
