---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atlas
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: envoy-gateway
      namespace: network
  values:
    controllers:
      atlas:
        strategy: RollingUpdate
        replicas: 1
        containers:
          app:
            # Static Web Server: one static binary from scratch, serves the
            # projected ConfigMaps at /public. Cache-Control is off so the
            # page's own fetches of state.json revalidate on every refresh.
            image:
              repository: docker.io/joseluisq/static-web-server
              tag: 2.44.1
            env:
              SERVER_PORT: "8080"
              SERVER_ROOT: /public
              SERVER_LOG_LEVEL: warn
              SERVER_COMPRESSION: "true"
              SERVER_CACHE_CONTROL_HEADERS: "false"
              SERVER_HEALTH: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: atlas
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Admin"
          gethomepage.dev/name: "Atlas"
          gethomepage.dev/icon: "mdi-map-search"
          gethomepage.dev/description: "Cluster atlas"
        # INTERNAL ONLY: the in-cluster copy renders the secondary zone in
        # the open (config.json). LAN DNS: unifi-dns publishes an A record
        # to envoy-internal; VPN clients get the same from k8s-gateway.
        hostnames:
          - "atlas.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      site:
        # One directory from three ConfigMaps: the page, the state files and
        # the substituted config.json. Projected volumes update in place.
        type: projected
        defaultMode: 0444
        sources:
          - configMap:
              name: atlas-site
          - configMap:
              name: atlas-state
          - configMap:
              name: atlas-config
              optional: true
        globalMounts:
          - path: /public
            readOnly: true
