---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# 1Password item "atlas" in vault "Home-Ops Default", field github_token: a
# fine-grained personal access token limited to this repository with
# Contents: Read and write (nothing else). It only ever pushes live.json.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlas-live
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: staging
  target:
    name: atlas-live-secret
    template:
      data:
        GITHUB_TOKEN: "{{ .github_token }}"
  dataFrom:
    - extract:
        key: atlas
