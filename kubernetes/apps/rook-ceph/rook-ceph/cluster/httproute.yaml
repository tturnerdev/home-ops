---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rook-ceph-dashboard
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Admin"
    gethomepage.dev/name: "Ceph"
    gethomepage.dev/icon: "ceph.svg"
    gethomepage.dev/description: "Storage dashboard"
    gethomepage.dev/href: "https://rook.turner.haus"
    gethomepage.dev/pod-selector: "app=rook-ceph-mgr"
spec:
  hostnames: ["rook.turner.haus"]
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: rook-ceph-mgr-dashboard
          namespace: rook-ceph
          port: 7000
