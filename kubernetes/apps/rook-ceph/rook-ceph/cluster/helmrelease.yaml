---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Rook >= 1.19 sets the Ceph image here (cephClusterSpec.cephVersion stays unset).
    # Pinned on purpose: the chart default jumps to Tentacle (v20.2.4) in 1.20/1.21,
    # and an unpinned bump would start a Ceph major upgrade.
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.4 # Tentacle (>= 20.2.2 required with readAffinity); forward-only
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Admin"
          gethomepage.dev/name: "Ceph"
          gethomepage.dev/icon: "ceph.svg"
          gethomepage.dev/description: "Storage"
          # Explicit even though sectionName below makes Homepage pick https
          gethomepage.dev/href: "https://rook.${SECRET_DOMAIN}"
          # The default status lookup (app.kubernetes.io/name=<route name>)
          # matches no pod; the mgr pods serve the dashboard
          gethomepage.dev/pod-selector: "app=rook-ceph-mgr"
        host:
          name: "rook.${SECRET_DOMAIN}"
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
            # https only: the http listener carries the 301 redirect
            sectionName: https
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      healthCheck:
        # These three stay while the CSI keys must be aes (security.cephx.csi
        # below); muted so a new, real warning still turns the cluster
        # HEALTH_WARN. Unmute when the nodes run Linux 7.0+ and the CSI keys
        # move to aes256k.
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        # prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090 # disabled for now until we have a prometheus instance
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            # Off from Tentacle on: Rook lists "several known stability issues"
            # with it there; only some dashboard pages go away.
            enabled: false
      network:
        provider: host
        connections:
          requireMsgr2: true
      security:
        cephx:
          # Ceph 19.2.6 / 20.2.4 (CVE-2025-30156) flag the old aes key type and
          # hold the cluster in HEALTH_ERR until the daemon keys are rotated.
          # Rook picks aes256k for them; raise keyGeneration to rotate again.
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          # Kernel RBD can use aes256k keys only from Linux 7.0 on (the nodes
          # run 6.18), so the CSI keys stay aes.
          csi:
            keyType: aes
      storage:
        useAllNodes: true
        useAllDevices: false
        devicePathFilter: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
        config:
          osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          # allowVolumeExpansion: true # Default: true
          # volumeBindingMode: Immediate # Default: Immediate
          mountOptions: ["discard"] # this might enable UNMAP / TRIM at the block storage layer
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    # cephBlockPoolsVolumeSnapshotClass:
    #   enabled: true
    #   name: csi-ceph-blockpool
    #   isDefault: false
    #   deletionPolicy: Delete
    # NOTE: After disabling the filesystem, the filesystem can be removed with the following commands:
    # ceph fs fail ceph-filesystem && ceph fs rm ceph-filesystem --yes-i-really-mean-it
    cephFileSystems: []
    cephObjectStores:
      - name: ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
          dataPool:
            failureDomain: host
            replicated:
              size: 3
          preservePoolsOnDelete: true
          gateway:
            port: 80
            instances: 1
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
        storageClass:
          enabled: true
          name: ceph-bucket
          # Retain so deleting an ObjectBucketClaim never drops backup data
          reclaimPolicy: Retain
          parameters:
            region: us-east-1
