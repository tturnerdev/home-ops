---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 4
  values:
    csi:
      # Rook >= 1.20: the CSI drivers are admin-managed by the ceph-csi-operator
      # (../csi-drivers); the operator chart keeps the subchart switch, the image
      # set and the ServiceMonitor. Keep createCsiOperatorResources explicit: the
      # 1.21.0 chart still templates it but dropped it from values.yaml, which
      # renders an empty ROOK_CREATE_CSI_OPERATOR_RESOURCES.
      createCsiOperatorResources: true
      serviceMonitor:
        enabled: true
    enableDiscoveryDaemon: true
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 128Mi # unchangable
        cpu: 100m # unchangable
      limits: {}
