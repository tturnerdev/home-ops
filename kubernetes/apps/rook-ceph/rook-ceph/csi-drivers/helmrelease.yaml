---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # The name is load-bearing: Rook >= 1.19.5 stamps the Driver and OperatorConfig
  # CRs it created with meta.helm.sh/release-name=ceph-csi-drivers (release
  # namespace = the operator namespace), so this release adopts them instead of
  # failing with "invalid ownership metadata".
  name: ceph-csi-drivers
spec:
  interval: 1h
  chart:
    spec:
      chart: ceph-csi-drivers
      # Keep in step with the ceph-csi-operator subchart the rook-ceph chart pins
      # (Chart.yaml: 1.0.4 for Rook v1.20.9, 1.1.0 for Rook 1.21.0).
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
      interval: 1h
  dependsOn:
    - name: rook-ceph-operator
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # Rook's recommended values (deploy/charts/ceph-csi-drivers/values.yaml at the
  # Rook tag) plus every setting needed to reproduce the Driver/OperatorConfig
  # that Rook 1.18/1.19 created, so adopting them changes nothing live.
  values:
    operatorConfig:
      namespace: rook-ceph # namespace:operator
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        clusterName: rook-ceph        # live; rendered into --clustername
        enableMetadata: false         # live
        grpcTimeout: 150              # live effective value (operator default); chart default is 30
        snapshotPolicy: volumeSnapshot # live effective value (operator default); chart default 'none' would drop the csi-snapshotter sidecar
        log:
          verbosity: 0
          rotation:
            enabled: false            # live: log {} -> no log-rotator sidecar / hostPath
        nodePlugin:
          priorityClassName: system-node-critical
          kubeletDirPath: /var/lib/kubelet
          enableSeLinuxHostMount: false
          imagePullPolicy: ""         # live "" (operator resolves "" to IfNotPresent)
        controllerPlugin:
          priorityClassName: system-cluster-critical
          replicas: 2                 # live; chart default is 1 (operator default would be 2)
          deploymentStrategy:
            type: Recreate            # live (operator default)
          imagePullPolicy: ""
    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com # csi-provisioner-name
        imageSet:
          name: rook-csi-operator-image-set-configmap
        clusterName: rook-ceph
        enableMetadata: false
        grpcTimeout: 150
        snapshotPolicy: volumeSnapshot
        log:
          verbosity: 0
          rotation:
            enabled: false
        nodePlugin:
          priorityClassName: system-node-critical
          kubeletDirPath: /var/lib/kubelet
          enableSeLinuxHostMount: false
          imagePullPolicy: ""
          updateStrategy:
            type: RollingUpdate
          resources:
            plugin:
              limits: { memory: 1Gi }
              requests: { cpu: 250m, memory: 512Mi }
            registrar:
              limits: { memory: 256Mi }
              requests: { cpu: 50m, memory: 128Mi }
        controllerPlugin:
          priorityClassName: system-cluster-critical
          replicas: 2
          deploymentStrategy:
            type: Recreate
          imagePullPolicy: ""
          resources:
            attacher:
              limits: { memory: 256Mi }
              requests: { cpu: 100m, memory: 128Mi }
            provisioner:
              limits: { memory: 256Mi }
              requests: { cpu: 100m, memory: 128Mi }
            resizer:
              limits: { memory: 256Mi }
              requests: { cpu: 100m, memory: 128Mi }
            snapshotter:
              limits: { memory: 256Mi }
              requests: { cpu: 100m, memory: 128Mi }
            omapGenerator:
              limits: { memory: 1Gi }
              requests: { cpu: 250m, memory: 512Mi }
            plugin:
              limits: { memory: 1Gi }
              requests: { memory: 512Mi }
      cephfs:
        enabled: false
      nfs:
        enabled: false
      nvmeof:
        enabled: false
