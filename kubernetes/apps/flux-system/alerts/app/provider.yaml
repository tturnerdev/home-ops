---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/notification.toolkit.fluxcd.io/provider_v1beta3.json
# Flux has no ntfy provider type, so this is the generic webhook: it POSTs the
# raw event JSON, and the ntfy template headers in the secret turn that into a
# titled notification. The secret also keeps the public ntfy URL out of this
# public repo.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: ntfy
spec:
  type: generic
  secretRef:
    name: flux-alerts-ntfy
