---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cert-manager-secret
              key: api-token
        selector:
          dnsZones: ["${SECRET_DOMAIN}"]
      # Secondary domain: the Cloudflare token is zone-scoped to the primary
      # domain, so validate over HTTP through the cloudflared tunnel instead
      - http01:
          ingress:
            ingressClassName: external
        selector:
          dnsZones: ["${SECRET_DOMAIN_2}"]
