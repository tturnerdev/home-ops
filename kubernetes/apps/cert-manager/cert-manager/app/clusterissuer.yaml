---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      # Both zones validate over DNS-01: the token has DNS:Edit on the secondary
      # zone too (proven by the paperclip certificate it issued), wildcards need
      # DNS-01, and the former HTTP-01 path depended on ingress-nginx and the tunnel.
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cert-manager-secret
              key: api-token
        selector:
          dnsZones: ["${SECRET_DOMAIN}", "${SECRET_DOMAIN_2}"]
