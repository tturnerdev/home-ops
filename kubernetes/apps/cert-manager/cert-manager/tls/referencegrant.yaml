---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/referencegrant_v1.json
# Lets the envoy Gateways (network) serve the wildcard certificate, which
# ingress-nginx also uses as its default certificate.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: envoy-gateway-tls
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: network
  to:
    - group: ""
      kind: Secret
      name: "${SECRET_DOMAIN/./-}-production-tls"
