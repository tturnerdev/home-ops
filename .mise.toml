[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
# pipx installs (makejinja) must not use the system pipx's own python (3.11);
# point pipx venvs at the repo venv python (mise-managed, satisfies >=3.12)
PIPX_DEFAULT_PYTHON = "{{config_root}}/.venv/bin/python"
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
BOOTSTRAP_DIR = "{{config_root}}/bootstrap"
KUBERNETES_DIR = "{{config_root}}/kubernetes"
ROOT_DIR = "{{config_root}}"
SCRIPTS_DIR = "{{config_root}}/scripts"
TALOS_DIR = "{{config_root}}/talos"
# Disable checksum verification for aqua packages that don't provide checksums.txt
# Didn't work... trying alternate package source below
#MISE_AQUA_CHECKSUM = "false"

[tools]
"python" = "3.15.1"
"pipx:makejinja" = "2.9.1"
"aqua:budimanjojo/talhelper" = "3.1.17"
"aqua:cilium/cilium-cli" = "0.20.2"
"aqua:cli/cli" = "2.103.3"
"aqua:cloudflare/cloudflared" = "2026.10.3"
#"aqua:cue-lang/cue" = "0.15.1"
# Fix for missing checksum error
"ubi:cue-lang/cue" = "0.17.1"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.54.0"
"aqua:helm/helm" = "4.3.1"
"aqua:helmfile/helmfile" = "1.8.2"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.8.0"
"aqua:kubernetes/kubernetes/kubectl" = "1.36.5"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:siderolabs/talos" = "1.14.4"
"aqua:yannh/kubeconform" = "0.8.0"
