---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# Charts whose CRDs the cluster needs outside of Flux: ServiceMonitors,
# DNSEndpoints and Gateways are applied before (or without) the chart that
# ships them, and Helm never upgrades a chart's crds/ on its own. Only ever
# template this file; the CRDs are picked out of the rendered output because
# Helm 4 accepts nothing but a plugin as a post-renderer:
#
#   helmfile --file bootstrap/helmfile.d/00-crds.yaml template \
#     | yq ea 'select(.kind == "CustomResourceDefinition")' \
#     | kubectl apply --server-side --force-conflicts --filename -
#
# scripts/bootstrap-apps.sh (task bootstrap:apps) runs the same pipeline.

helmDefaults:
  args:
    - --include-crds
    - --no-hooks
  # Rendered with chart defaults, which a chart's values schema may reject
  # (external-dns insists on a policy); the values never reach the cluster
  skipSchemaValidation: true

releases:
  - name: cloudflare-dns
    namespace: network
    chart: oci://ghcr.io/home-operations/charts-mirror/external-dns
    version: 1.23.0

  - name: envoy-gateway
    namespace: network
    chart: oci://mirror.gcr.io/envoyproxy/gateway-helm
    version: v1.8.5

  - name: grafana-operator
    namespace: observability
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: 5.21.3

  # - name: keda
  #   namespace: observability
  #   chart: oci://ghcr.io/home-operations/charts-mirror/keda
  #   version: 2.18.3

  - name: kube-prometheus-stack
    namespace: observability
    chart: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    version: 81.2.0
