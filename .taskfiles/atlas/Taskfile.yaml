---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  ATLAS_SITE: '{{.KUBERNETES_DIR}}/apps/infra/atlas/app/site'

tasks:

  state:
    desc: Rebuild the Atlas state.json from the manifests in this repo (no cluster access)
    cmd: python3 {{.SCRIPTS_DIR}}/atlas/build-state.py
    preconditions:
      - which python3
      - python3 -c 'import yaml'

  live:
    desc: Collect live cluster facts into the Atlas live.json (read-only kubectl/talosctl)
    cmd: bash {{.KUBERNETES_DIR}}/apps/infra/atlas/cronjob/live.sh --out {{.ATLAS_SITE}}/live.json
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which kubectl jq

  refresh:
    desc: Rebuild state.json and live.json, then show what changed (commit and push to publish)
    cmds:
      - task: state
      - task: live
      - git -C {{.ROOT_DIR}} status --short -- {{.ATLAS_SITE}}

  serve:
    desc: Preview the Atlas page locally at http://localhost:8787
    dir: '{{.ATLAS_SITE}}'
    cmd: python3 -m http.server 8787
